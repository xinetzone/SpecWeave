services:
  caffe-ffi:
    build:
      context: ../..
      dockerfile: apps/caffe-ffi-jupyter/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-official}
        PIP_MIRROR: ${PIP_MIRROR:-official}
        CONDA_MIRROR: ${CONDA_MIRROR:-official}
        PYTHON_VERSION: "3.14"
        BASE_IMAGE: ${BASE_IMAGE:-jupyter-ssh-base:1.1}
    image: caffe-ffi-jupyter:latest
    container_name: caffe-ffi-jupyter
    ports:
      - "2222:22"      # SSH
      - "8888:8888"    # Jupyter Notebook
    volumes:
      # 挂载整个 SpecWeave 仓库到 /SpecWeave（不在 /workspace 下，避免启动时 chown -R 递归）
      # entrypoint 自动检测以下路径并执行 pip install -e：
      #   - /SpecWeave/projects/xuanspace/vendor/tvm-ffi
      #   - /SpecWeave/projects/xuanspace/libs/caffe-ffi
      # 也可通过环境变量 TVM_FFI_SRC_DIR / CAFFE_FFI_SRC_DIR 覆盖
      - ../..:/SpecWeave:cached
      # /workspace 使用 Docker 命名卷（Jupyter 工作目录，启动快，chown 无性能问题）
      - workspace:/workspace
      # 覆盖容器内的构建脚本（修复版：跳过重复构建、修复libopenblas/backtrace问题）
      - ./scripts/editable-install.sh:/usr/local/bin/editable-install.sh:ro
      # 覆盖容器内的健康检查脚本（修复版：protobuf ABI roundtrip测试）
      - ./scripts/container-healthcheck.sh:/usr/local/bin/container-healthcheck.sh:ro
    environment:
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
      - USER_PASSWORD=changeme
      - JUPYTER_TOKEN=jupyter123
      - GRANT_SUDO=yes
      - ALLOW_ROOT_SSH=no
      - DEBUG=0
      # 告知 editable-install.sh 源码挂载位置
      - WORKSPACE_DIR=/SpecWeave
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    tty: true
    stdin_open: true

volumes:
  workspace:
