# /etc/containers/storage.conf — rootless Podman inside the container
# fuse-overlayfs driver; requires the host to pass --device /dev/fuse
# (see the shared container contract: --device /dev/fuse + --security-opt
#  label=disable + --cgroupns=host, never --privileged).

[storage]
driver = "fuse-overlayfs"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
