# supervisord.conf — openKylin dev container service stack
# sshd runs as root (Port 22); jupyter runs as devuser (Port 8888).
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.err.log

[program:jupyter]
command=/usr/bin/python3 -m jupyter lab --config=/home/devuser/.jupyter/jupyter_notebook_config.py
user=devuser
environment=HOME="/home/devuser",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter.err.log
