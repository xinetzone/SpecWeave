[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "zhihu-checkin-hub"
version = "0.1.0"
description = "知乎打卡工作台：本地目标追踪/打卡 + 发布前固定门 + 知乎半自动发布桥（文件化、零 AI 生成、仅本地）"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
zhihu-checkin = "zhihu_checkin_hub.cli:app"

[tool.scikit-build]
wheel.packages = ["src/zhihu_checkin_hub"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# 编辑器即时红线：禁止 __future__ 导入（Python 3.14 其全部特性均已默认，
# 含 PEP 649 惰性注解；PEP 563 样板冗余且语义有别）。
# 运行期硬兜底见 tests/test_no_future_annotations.py。
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "Python 3.14 已默认 PEP 649 惰性注解，禁止 __future__ 导入（PEP 563 样板冗余）" }
