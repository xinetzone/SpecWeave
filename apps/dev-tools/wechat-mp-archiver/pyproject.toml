[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "wechat-mp-archiver"
version = "0.1.0"
description = "微信公众号全量内容归档工具：私有部署采集服务 + Python 薄管线，输出离线归档、RAG 语料与分析报表"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pandas>=2.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mp-archiver = "mp_archiver.cli:main"

[tool.scikit-build]
wheel.packages = ["src/mp_archiver"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
