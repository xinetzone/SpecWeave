[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "langgraph-commerce-poc"
version = "0.1.0"
description = "LangGraph 商业化 PoC：StateGraph 双节点 + MemorySaver 会话持久化 + DeepSeek 接入（含无 Key 演示模式）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-deepseek>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
langgraph-poc = "langgraph_poc.cli:main"

[tool.scikit-build]
wheel.packages = ["src/langgraph_poc"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# 项目红线：禁止 __future__ 导入（PEP 563 样板冗余；PEP 649 已默认惰性注解）。
# 运行期硬兜底见 tests/test_no_future_annotations.py。
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "项目红线：禁止 __future__ 导入（PEP 563 样板冗余）" }
