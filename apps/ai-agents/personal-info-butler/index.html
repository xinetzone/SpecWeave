<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人信息管家 Agent</title>
    <meta name="description" content="记录零散想法、资料与待办，自动分类、总结、关联，支持检索、问答、重点提取、待办整理与阶段总结" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">管</div>
          <div class="brand-text">
            <strong>个人信息管家</strong>
            <span id="storageBadge" class="badge">检测中…</span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item is-active" data-view="inbox"><i>✎</i>录入</button>
          <button class="nav-item" data-view="library"><i>▤</i>资料库</button>
          <button class="nav-item" data-view="ask"><i>?</i>智能问答</button>
          <button class="nav-item" data-view="todos"><i>✓</i>待办整理</button>
          <button class="nav-item" data-view="extract"><i>◆</i>重点提取</button>
          <button class="nav-item" data-view="summary"><i>◈</i>阶段总结</button>
        </nav>

        <div class="sidebar-block">
          <div class="block-title">概览</div>
          <div class="stats" id="stats"></div>
        </div>

        <div class="sidebar-block">
          <div class="block-title">标签</div>
          <div class="tagcloud" id="tagCloud"></div>
        </div>

        <button class="nav-item settings-btn" data-view="settings"><i>⚙</i>设置</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search">
            <input id="globalSearch" type="search" placeholder="关键词检索：想法、资料、待办…" />
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
            <button class="icon-btn" data-view="settings" title="设置">⚙</button>
          </div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="drawer-mask" id="drawerMask" hidden></div>
    <aside class="drawer" id="drawer" hidden></aside>
    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
