# 个人信息管家 Agent —— Python 包元数据
#
# 构建后端按 SpecWeave 主权区统一约定使用 scikit-build-core；本包为纯 Python，
# 故以 wheel.cmake = false 关闭 CMake 阶段（缺这一行 scikit-build-core 仍会
# 尝试 cmake configure，在没有 CMakeLists.txt 时直接构建失败）。

[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "info-butler"
version = "0.2.0"
description = "个人信息管家 Agent：Sphinx 静态站 + Python 3.14 云端 API"
readme = "README.md"
# ★ 下限放宽到 3.13：发布平台的 pyenv 沙箱不一定装了 3.14，写死 >=3.14 会让
    # pip 直接报 "requires a different Python" 而装不上。源码已实测兼容 3.13
    # （无 3.14 专属语法、无 __future__ annotations）。开发与本地仍首选 3.14。
    requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # ★ 下限不能写 2.7：pip 解析时可能选中 pydantic 2.7.x → pydantic-core 2.18.x，
    # 而那批 pydantic-core **没有 cp314 轮子**，在 Python 3.14 上直接
    # ResolutionImpossible（发布沙箱正是 3.14，表现为「安装依赖失败」）。
    # 2.14.1 对应的 pydantic-core 2.50.1 已确认提供 cp314 轮子。
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# dev 必须包含站点构建依赖：tests/test_site_contract.py 会 import sphinx_book_theme
# 校验「侧边栏是全站唯一搜索入口」这条上游契约。缺了它，CI 的 gates job 会在
# 收集阶段直接 ModuleNotFoundError —— 门禁变成噪声，真实的契约漂移反而看不见。
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sphinx>=8.2",
    "sphinx-book-theme>=1.1",
]

[project.scripts]
info-butler = "info_butler.cli:main"

[tool.scikit-build]
wheel.packages = ["src/info_butler"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"
sdist.exclude = ["_build", "build", ".venv", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/info_butler"]
branch = true

# 编辑器即时红线：禁止 __future__ 导入（Python 3.14 已默认 PEP 649 惰性注解，
# PEP 563 样板冗余且语义有别）。运行期硬兜底见 tests/test_no_future_annotations.py。
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "Python 3.14 已默认 PEP 649 惰性注解，禁止 __future__ 导入（PEP 563 样板冗余）" }
