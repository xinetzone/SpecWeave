# 个人信息管家 Agent —— Python 包元数据
#
# 构建后端按 SpecWeave 主权区统一约定使用 scikit-build-core；本包为纯 Python，
# 故以 wheel.cmake = false 关闭 CMake 阶段（缺这一行 scikit-build-core 仍会
# 尝试 cmake configure，在没有 CMakeLists.txt 时直接构建失败）。

[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "info-butler"
version = "0.2.0"
description = "个人信息管家 Agent：Sphinx 静态站 + Python 3.14 云端 API"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
info-butler = "info_butler.cli:main"

[tool.scikit-build]
wheel.packages = ["src/info_butler"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"
sdist.exclude = ["_build", "build", ".venv", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/info_butler"]
branch = true

# 编辑器即时红线：禁止 __future__ 导入（Python 3.14 已默认 PEP 649 惰性注解，
# PEP 563 样板冗余且语义有别）。运行期硬兜底见 tests/test_no_future_annotations.py。
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "Python 3.14 已默认 PEP 649 惰性注解，禁止 __future__ 导入（PEP 563 样板冗余）" }
