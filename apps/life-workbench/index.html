<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一页生活 · 集成式生活工作台</title>
<style>
  :root{
    --paper:#f7f5f0;
    --paper-2:#fffdf8;
    --panel:#ffffff;
    --ink:#22201c;
    --ink-2:#4a453c;
    --muted:#6b6255;
    --line:#e4ded2;
    --line-2:#efeae0;
    --moss:#3f5d4a;
    --moss-soft:#e8efe9;
    --amber:#96661a;
    --amber-soft:#f7efdd;
    --rose:#a4503f;
    --rose-soft:#f6e8e4;
    --blue:#3f5f78;
    --blue-soft:#e8eef4;
    --radius:10px;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"SF Mono","Cascadia Mono","Consolas",monospace;
    --shadow:0 1px 2px rgba(34,32,28,.05),0 8px 24px -16px rgba(34,32,28,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 320px),
      repeating-linear-gradient(0deg,rgba(34,32,28,.018) 0 1px,transparent 1px 28px);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:4px}
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ic-lg{width:20px;height:20px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  .rail{
    border-right:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
    padding:22px 14px 28px;position:sticky;top:0;height:100vh;overflow:auto;
  }
  .brand{display:flex;gap:10px;align-items:baseline;padding:0 8px 16px;border-bottom:1px solid var(--line)}
  .brand b{font-family:var(--serif);font-size:19px;letter-spacing:.06em;font-weight:600}
  .brand span{font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .rail-group{margin-top:18px}
  .rail-title{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;padding:0 8px 6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
    color:var(--ink-2);text-align:left;transition:background .16s,color .16s;
  }
  .nav button .dot{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .nav button:hover{background:rgba(63,93,74,.07)}
  .nav button[aria-current="true"]{background:var(--moss);color:#fff;box-shadow:var(--shadow)}
  .nav button[aria-current="true"] .dot{color:rgba(255,255,255,.72)}
  .rail-foot{margin-top:22px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}

  .main{min-width:0;padding:0 0 64px}
  .masthead{
    display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
    padding:24px 30px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));
  }
  .masthead h1{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em}
  .masthead .sub{color:var(--muted);font-size:12px;letter-spacing:.04em}
  .masthead .tools{display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel);color:var(--ink-2);font-size:12.5px;transition:.16s;
  }
  .btn:hover{border-color:var(--moss);color:var(--moss)}
  .btn.primary{background:var(--moss);border-color:var(--moss);color:#fff}
  .btn.primary:hover{background:#35503f;color:#fff}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:rgba(63,93,74,.08)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.danger:hover{border-color:var(--rose);color:var(--rose)}

  .banner{
    display:none;gap:10px;align-items:flex-start;margin:14px 30px 0;padding:11px 14px;
    border-radius:var(--radius);border:1px solid var(--amber);background:var(--amber-soft);
    font-size:12.5px;color:#6d4e12;
  }
  .banner.show{display:flex}
  .banner.error{border-color:var(--rose);background:var(--rose-soft);color:#7c2f20}
  .banner .grow{flex:1}
  .banner .acts{display:flex;gap:6px;flex-wrap:wrap}

  .view{padding:22px 30px 0;max-width:1180px}
  .sec{margin:0 0 30px}
  .sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .sec-head h2{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em}
  .sec-head .hint{font-size:12px;color:var(--muted)}
  .sec-head .spacer{flex:1}
  .sec-head .tools{display:flex;gap:8px;flex-wrap:wrap}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel.pad{padding:16px 18px}
  .split{display:grid;gap:16px}
  .split.c2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .split.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hair{height:1px;background:var(--line-2);margin:12px 0}

  .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .v{font-family:var(--serif);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .stat .delta{font-size:11.5px;font-variant-numeric:tabular-nums}
  .pos{color:var(--moss)}.neg{color:var(--rose)}.warn{color:var(--amber)}

  /* today hero */
  .hero{
    display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:26px;align-items:center;
    padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius);
    background:
      linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.6)),
      radial-gradient(120% 140% at 0% 0%,var(--moss-soft),transparent 60%);
    box-shadow:var(--shadow);
  }
  .index-badge{position:relative;width:132px;height:132px;flex:none}
  .index-badge svg{width:100%;height:100%;transform:rotate(-90deg)}
  .index-badge .cap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .index-badge .cap b{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
  .index-badge .cap span{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:4px}
  .hero-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
  .hero-metric{border-left:2px solid var(--line);padding-left:10px}
  .hero-metric .v{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
  .hero-metric .k{font-size:11px;color:var(--muted)}
  .focus{list-style:none;margin:0;padding:0}
  .focus li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line-2)}
  .focus li:last-child{border-bottom:none}
  .focus .tag{font-size:10px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
  .focus .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-size:12.5px;padding:14px 0;text-align:center}

  /* lists */
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line-2)}
  .rows li:last-child{border-bottom:none}
  .rows .grow{flex:1;min-width:0}
  .rows .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
  .rows .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .rows .amt{font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums}
  .row-acts{display:flex;gap:4px;opacity:.55;transition:.16s}
  .rows li:hover .row-acts,.rows li:focus-within .row-acts{opacity:1}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
  .chip.moss{background:var(--moss-soft);color:var(--moss)}
  .chip.amber{background:var(--amber-soft);color:var(--amber)}
  .chip.rose{background:var(--rose-soft);color:var(--rose)}
  .chip.blue{background:var(--blue-soft);color:var(--blue)}

  /* toolbar / forms */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field .lb{font-size:11px;color:var(--muted);letter-spacing:.04em}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);
    font-size:13px;min-width:0;width:100%;
  }
  textarea{resize:vertical;min-height:60px}
  input:focus,select:focus,textarea:focus{border-color:var(--moss)}
  .inline{display:flex;gap:8px;align-items:center}
  .checkline{display:flex;gap:9px;align-items:flex-start;font-size:13px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--moss);flex:none;margin-top:3px}
  .segs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
  .segs button{padding:5px 12px;font-size:12px;color:var(--ink-2)}
  .segs button[aria-pressed=true]{background:var(--moss);color:#fff}

  /* dialog */
  dialog{
    border:none;padding:0;border-radius:14px;background:var(--panel);color:var(--ink);
    box-shadow:0 24px 60px -20px rgba(34,32,28,.45);width:min(560px,calc(100vw - 32px));
  }
  dialog::backdrop{background:rgba(34,32,28,.42);backdrop-filter:blur(3px)}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
  .dlg-head h3{margin:0;font-family:var(--serif);font-size:16px;font-weight:600;flex:1}
  .dlg-body{padding:16px 18px;display:grid;gap:12px;max-height:min(62vh,520px);overflow:auto}
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .err{color:var(--rose);font-size:12px;min-height:0}

  /* finance structure bars */
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:88px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:12.5px}
  .bar .track{height:9px;background:var(--line-2);border-radius:999px;overflow:hidden}
  .bar .fill{height:100%;border-radius:999px}
  .bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

  /* habit heatmap */
  .habit{border-bottom:1px solid var(--line-2);padding:14px 2px}
  .habit:last-child{border-bottom:none}
  .habit-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .habit-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .swatch{width:9px;height:9px;border-radius:2px;flex:none}
  .heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:10px}
  .heat i{display:block;aspect-ratio:1;border-radius:2px;background:var(--line-2)}
  .counter{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .counter button{padding:4px 11px;font-size:14px;color:var(--ink-2)}
  .counter button:hover{background:rgba(63,93,74,.08)}
  .counter .n{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:3px 0}
  .counter input.n{border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;width:56px}

  /* media wall */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
  .cover{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;color:#fff}
  .cover .ct{font-family:var(--serif);font-size:13px;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .cover .ca{font-size:10.5px;opacity:.86;margin-top:3px}
  .cover .badge{position:absolute;top:7px;left:7px;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.9);color:#333}
  .cover .del{position:absolute;top:5px;right:5px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.92);color:#333;opacity:.85}
  .cover .del:hover{opacity:1;background:#fff}
  .stars{letter-spacing:.06em;font-size:12px;color:var(--amber)}
  .mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:74px}
  .mgrid i{background:var(--moss-soft);border-radius:2px;display:block;min-height:2px;border-top:1px solid var(--moss)}

  .plan{display:grid;gap:6px}
  .plan-row{display:grid;grid-template-columns:56px minmax(0,1fr) 30px;gap:10px;align-items:center}
  .plan-row input{border:1px solid transparent;background:transparent;padding:5px 6px}
  .plan-row input:hover{border-color:var(--line)}
  .plan-row input:focus{border-color:var(--moss);background:var(--panel)}
  .plan-row.today{background:var(--moss-soft);border-radius:8px}
  .plan-row .d{font-size:12px;color:var(--muted);letter-spacing:.08em}

  .foot{padding:26px 30px 0;color:var(--muted);font-size:11.5px;max-width:1180px}

  /* ---------- responsive ---------- */
  @media (max-width:1080px){
    .split.c2,.split.c3{grid-template-columns:minmax(0,1fr)}
    .hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
    .hero-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .rail{
      position:sticky;top:0;height:auto;border-right:none;border-bottom:1px solid var(--line);
      padding:12px 12px 10px;z-index:20;background:var(--paper-2);
    }
    .brand{padding:0 4px 10px}
    .rail-title,.rail-foot{display:none}
    .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .nav button{width:auto;flex:none;border:1px solid var(--line);padding:7px 12px}
    .nav button .dot{margin-left:4px}
    .masthead{padding:18px 16px 14px}
    .masthead h1{font-size:21px}
    .view{padding:16px 16px 0}
    .banner{margin:12px 16px 0}
    .foot{padding:20px 16px 0}
    .grid2,.grid3{grid-template-columns:1fr}
    .heat{grid-template-columns:repeat(15,1fr)}
    .bar{grid-template-columns:72px minmax(0,1fr) 84px;font-size:12px}
    .wall{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="g-stroke"></g>
  </defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.3-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.7-7 9-7 9z"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h4l3 7 4-14 3 7h6"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h9.6L19 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h12v16H7a2 2 0 01-2-2z"/><path d="M5 4a2 2 0 00-2 2v14a2 2 0 002 2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 20h16"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>

  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5L21 19H3z"/><path d="M12 9.5v4M12 16.6h.01"/></symbol>

</svg>

<div class="shell">
  <aside class="rail">
    <div class="brand"><b>一页生活</b><span>life&nbsp;desk</span></div>
    <div class="rail-group">
      <div class="rail-title">今日</div>
      <nav class="nav" id="nav" aria-label="模块导航"></nav>
    </div>
    <div class="rail-foot">
      数据仅保存在本机浏览器。<br>建议定期导出 JSON 备份。
      <div id="storeState" style="margin-top:6px"></div>
    </div>
  </aside>

  <main class="main">
    <header class="masthead">
      <div>
        <h1 id="mhTitle">今日</h1>
        <div class="sub" id="mhSub"></div>
      </div>
      <div class="tools">
        <button class="btn" id="btnQuick"><svg class="ic"><use href="#i-plus"/></svg>快速新增</button>
        <button class="btn" id="btnExport"><svg class="ic"><use href="#i-down"/></svg>导出备份</button>
        <button class="btn" id="btnImport"><svg class="ic"><use href="#i-up"/></svg>导入备份</button>
        <button class="btn" id="btnSettings"><svg class="ic"><use href="#i-gear"/></svg>设置</button>
      </div>
    </header>

    <div class="banner" id="bannerBackup" role="status"></div>
    <div class="banner error" id="bannerStore" role="alert"></div>

    <section class="view" id="view"></section>

    <p class="foot">
      一页生活 · 单文件本地工作台。全部数据存放于当前浏览器的 localStorage，不上传、不联网、不含第三方组件。
      「Excel 导出」生成带 BOM 的 UTF-8 CSV，可直接用 Excel 打开。
    </p>
  </main>
</div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">

<script>
/* =========================================================
   一页生活 · 单文件本地生活工作台
   数据：localStorage（主存储 + 安全快照）
   ========================================================= */
(function () {
'use strict';

/* ---------- 基础工具 ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
var NS = 'http://www.w3.org/2000/svg';

function h(tag, attrs) {

    for (var k in attrs) {

      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);

  }
  for (var i = 0; i < kids.length; i++) {
    var kid = kids[i];
    if (kid === null || kid === undefined || kid === false) continue;

    else n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

/* ---------- 日期 ---------- */
function iso(d) {
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}
function today() { return iso(new Date()); }
function parseD(s) { var p = String(s || '').split('-'); return new Date(num(p[0], 2000), num(p[1], 1) - 1, num(p[2], 1)); }
function addDays(s, n) { var d = parseD(s || today()); d.setDate(d.getDate() + n); return iso(d); }
function monthOf(s) { return String(s || '').slice(0, 7); }
function curMonth() { return today().slice(0, 7); }
function addMonth(mk, n) {
  var p = mk.split('-'), d = new Date(num(p[0]), num(p[1]) - 1 + n, 1);
  return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' + (d.getMonth() + 1) : (d.getMonth() + 1));
}
var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function weekday(s) { return WD[parseD(s).getDay()]; }
function prettyDate(s) {
  if (s === today()) return '今天';
  if (s === addDays(today(), 1)) return '明天';
  if (s === addDays(today(), -1)) return '昨天';
  return s.slice(5).replace('-', '/') + ' ' + weekday(s);
}

/* ---------- 归一化（导入与读取共用） ---------- */
var ARRAYS = ['tx', 'habits', 'events', 'wish', 'media'];
var WISH_PRIO = ['high', 'mid', 'low'];
var MEDIA_TYPES = ['书', '电影', '剧集', '音乐', '播客', '其他'];
var MEDIA_STATUS = [['want', '想看'], ['doing', '在看'], ['done', '已完成'], ['hold', '搁置']];

/* 导入数据的字段与类型校验：白名单 + 类型收敛，避免脏数据导致模块不可渲染 */
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function sStr(v, d) { return typeof v === 'string' ? v : d; }
function sNum(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
function sBool(v) { return v === true; }
function sDate(v, d) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : d; }
function sColor(v, d) { return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v.trim()) ? v.trim() : d; }
function sanTx(x) {
  return {
    id: sStr(x.id) || uid(), date: sDate(x.date, today()),
    type: x.type === 'income' ? 'income' : 'expense',
    amount: Math.max(0, n2(sNum(x.amount, 0))),
    category: (sStr(x.category, '').trim() || '其他').slice(0, 40),
    note: sStr(x.note, '').slice(0, 200), demo: sBool(x.demo)
  };
}
function sanHabit(x) {
  var logs = {};
  if (x.logs && typeof x.logs === 'object') {
    Object.keys(x.logs).forEach(function (k) {
      var n = sNum(x.logs[k], NaN);
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && isFinite(n)) logs[k] = Math.max(0, n);
    });
  }
  return {
    id: sStr(x.id) || uid(), name: (sStr(x.name, '').trim() || '未命名习惯').slice(0, 40),
    type: (x.type === 'count' || x.type === 'number') ? x.type : 'check',
    target: Math.max(1, sNum(x.target, 1)), unit: sStr(x.unit, '').slice(0, 12),
    color: sColor(x.color, '#3f5d4a'), logs: logs, demo: sBool(x.demo)
  };
}
function sanEvent(x) {
  var time = sStr(x.time, '');
  return {
    id: sStr(x.id) || uid(), title: (sStr(x.title, '').trim() || '未命名日程').slice(0, 60),
    date: sDate(x.date, today()), time: /^\d{2}:\d{2}$/.test(time) ? time : '',
    type: (sStr(x.type, '').trim() || '其他').slice(0, 20), note: sStr(x.note, '').slice(0, 200),
    done: sBool(x.done), demo: sBool(x.demo)
  };
}
function sanWish(x) {
  return {
    id: sStr(x.id) || uid(), name: (sStr(x.name, '').trim() || '未命名条目').slice(0, 60),
    qty: Math.max(1, Math.round(sNum(x.qty, 1))), price: Math.max(0, n2(sNum(x.price, 0))),
    priority: WISH_PRIO.indexOf(x.priority) >= 0 ? x.priority : 'mid',
    category: sStr(x.category, '').trim().slice(0, 20), bought: sBool(x.bought), demo: sBool(x.demo)
  };
}
function sanMedia(x) {
  var status = MEDIA_STATUS.some(function (m) { return m[0] === x.status; }) ? x.status : 'want';
  return {
    id: sStr(x.id) || uid(), type: MEDIA_TYPES.indexOf(x.type) >= 0 ? x.type : '其他',
    title: (sStr(x.title, '').trim() || '未命名').slice(0, 80),
    creator: sStr(x.creator, '').trim().slice(0, 60), status: status,
    date: sDate(x.date, '') || '', stars: clamp(Math.round(sNum(x.stars, 0)), 0, 5),
    note: sStr(x.note, '').slice(0, 300), demo: sBool(x.demo)
  };
}
function normalize(raw) {
  var s = blankState();
  if (!raw || typeof raw !== 'object') return s;
  s.schemaVersion = SCHEMA;
  if (raw.profile && typeof raw.profile === 'object') {
    s.profile.height = num(raw.profile.height, 170);
    s.profile.startWeight = num(raw.profile.startWeight, 0);
    s.profile.targetWeight = num(raw.profile.targetWeight, 0);
    s.profile.monthlyBudget = num(raw.profile.monthlyBudget, 0);
  }
  if (Array.isArray(raw.tx)) s.tx = raw.tx.filter(isObj).map(sanTx);
  if (Array.isArray(raw.habits)) s.habits = raw.habits.filter(isObj).map(sanHabit);
  if (Array.isArray(raw.events)) s.events = raw.events.filter(isObj).map(sanEvent);
  if (Array.isArray(raw.wish)) s.wish = raw.wish.filter(isObj).map(sanWish);
  if (Array.isArray(raw.media)) s.media = raw.media.filter(isObj).map(sanMedia);
  if (raw.fit && typeof raw.fit === 'object') {
    if (Array.isArray(raw.fit.logs)) {
      s.fit.logs = raw.fit.logs.filter(function (x) { return x && typeof x === 'object'; }).map(function (x) {
        return {
          id: x.id || uid(), date: typeof x.date === 'string' ? x.date : today(),
          weight: num(x.weight, 0), fat: num(x.fat, 0), intake: num(x.intake, 0), burn: num(x.burn, 0)
        };
      });
    }
    if (Array.isArray(raw.fit.plan) && raw.fit.plan.length === 7) {
      s.fit.plan = raw.fit.plan.map(function (p, i) {
        return { day: num(p && p.day, i), text: (p && typeof p.text === 'string') ? p.text : '' };
      });
    }
    s.fit.done = (raw.fit.done && typeof raw.fit.done === 'object') ? raw.fit.done : {};
  }
  if (raw.meta && typeof raw.meta === 'object') {
    s.meta.addedSinceBackup = num(raw.meta.addedSinceBackup, 0);
    s.meta.lastBackup = typeof raw.meta.lastBackup === 'string' ? raw.meta.lastBackup : null;
    s.meta.demo = !!raw.meta.demo;
  }
  return s;
}
function countRecords(s) {
  return s.tx.length + s.habits.length + s.fit.logs.length + s.events.length + s.wish.length + s.media.length;
}

/* ---------- 持久化 ---------- */
function persistNow() {
  var json;
  try { json = JSON.stringify(S); } catch (e) { setStoreError('数据序列化失败：' + e.message); return false; }
  try {
    var prev = localStorage.getItem(KEY_MAIN);
    if (prev && prev !== lastWritten) {
      try { JSON.parse(prev); localStorage.setItem(KEY_SAFE, prev); } catch (e2) { /* 损坏的旧值不覆盖安全快照 */ }
    }
    localStorage.setItem(KEY_MAIN, json);
    lastWritten = json;
    if (storageBroken) { storageBroken = false; renderStoreBanner(); }
    return true;
  } catch (e) {
    setStoreError(e && e.name === 'QuotaExceededError'
      ? '浏览器存储空间已满，最新修改未能写入磁盘。'
      : '无法写入浏览器存储：' + (e && e.message ? e.message : e));
    return false;
  }
}
function schedulePersist() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { saveTimer = null; persistNow(); }, 180);
}
function flushPending() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  persistNow();
}
function commit(added) {
  if (added) bumpAdded(added);
  schedulePersist();
  render();
}
function bumpAdded(n) {
  S.meta.addedSinceBackup = num(S.meta.addedSinceBackup, 0) + (n || 1);
  renderBackupBanner();
}
function setStoreError(msg) {
  storageBroken = true;
  var b = $('#bannerStore');
  b.textContent = '';
  b.append(icon('alert'), h('div', { class: 'grow', text: msg + ' 当前修改仅保留在内存中，请立即导出备份，避免关闭页面后丢失。' }));
  b.append(h('div', { class: 'acts' },
    h('button', { class: 'btn sm', type: 'button', onclick: emergencyExport }, '紧急导出 JSON'),
    h('button', { class: 'btn sm', type: 'button', onclick: function () { if (persistNow()) renderStoreBanner(); } }, '重试保存')
  ));
  b.classList.add('show');
}
function renderStoreBanner() {
  var b = $('#bannerStore');
  if (!storageBroken) { b.classList.remove('show'); b.textContent = ''; }
  var st = $('#storeState');
  st.textContent = storageBroken ? '存储状态：异常（未写入）' : '存储状态：正常';
  st.style.color = storageBroken ? 'var(--rose)' : 'var(--moss)';
}

/* ---------- 启动读取与损坏恢复 ---------- */
function loadState() {
  var raw = null;
  try { raw = localStorage.getItem(KEY_MAIN); } catch (e) { setStoreError('无法读取浏览器存储：' + e.message); S = demoState(); return; }
  if (raw === null) { S = demoState(); persistNow(); return; }
  try {
    S = normalize(JSON.parse(raw));
    lastWritten = JSON.stringify(S);
  } catch (e) {
    showRecovery(raw);
  }
}
function readSafe() {
  try {
    var raw = localStorage.getItem(KEY_SAFE);
    if (!raw) return null;
    var s = normalize(JSON.parse(raw));
    return countRecords(s) > 0 || raw.length > 40 ? s : null;
  } catch (e) { return null; }
}
function showRecovery(raw) {
  var safe = readSafe();
  S = safe || demoState();
  var body = h('div', null,
    h('p', { text: '浏览器中的主数据无法解析（可能是存储写入中断或数据被外部修改）。请选择处理方式，未确认前应用不会覆盖原始数据。' }),
    h('p', { class: 'label', text: '原始内容前 120 字符' }),
    h('pre', {
      style: 'margin:0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all',
      text: String(raw).slice(0, 120)
    })
  );
  var dlg = openDialog({
    title: '数据损坏，需要恢复',
    body: body,
    okText: safe ? '从安全快照恢复' : '使用演示数据',
    extra: [
      h('button', { class: 'btn', type: 'button', onclick: function () { download('life-corrupted-' + today() + '.txt', raw, 'text/plain;charset=utf-8'); } }, '下载损坏数据'),
      h('button', { class: 'btn danger', type: 'button', onclick: function () { S = demoState(); persistNow(); dlg.close(); render(); } }, '重置为演示数据')
    ],
    onOk: function () {
      if (!safe) S = demoState();
      persistNow();
      dlg.close();
      render();
    },
    closable: false
  });
}

/* ---------- 备份提醒 ---------- */
function renderBackupBanner() {
  var b = $('#bannerBackup'), n = num(S.meta.addedSinceBackup, 0);
  if (!storageBroken && n >= 20) {
    b.textContent = '';
    b.append(icon('alert'), h('div', { class: 'grow', text: '已新增 ' + n + ' 条记录尚未备份。数据只存在这台设备的浏览器里，建议现在导出一次 JSON 备份。' }));
    b.append(h('div', { class: 'acts' },
      h('button', { class: 'btn sm primary', type: 'button', onclick: exportJSON }, '立即导出'),
      h('button', { class: 'btn sm', type: 'button', onclick: function () { S.meta.addedSinceBackup = 0; commit(); } }, '稍后再说')
    ));
    b.classList.add('show');
  } else {
    b.classList.remove('show');
    b.textContent = '';
  }
}

/* ---------- 导出 / 导入 / 紧急导出 ---------- */
function download(name, text, mime) {
  var blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
}
function exportJSON() {
  flushPending();
  var payload = JSON.parse(JSON.stringify(S));
  payload.exportedAt = new Date().toISOString();
  payload.app = 'life-workbench';
  download('life-backup-' + today() + '.json', JSON.stringify(payload, null, 2));
  S.meta.addedSinceBackup = 0;
  S.meta.lastBackup = new Date().toISOString();
  commit();
}
function emergencyExport() {
  try {
    var payload = JSON.parse(JSON.stringify(S));
    payload.exportedAt = new Date().toISOString();
    payload.app = 'life-workbench';
    payload.emergency = true;
    download('life-emergency-' + today() + '.json', JSON.stringify(payload));
  } catch (e) {
    alert('紧急导出失败：' + (e && e.message ? e.message : e) + '。请改用浏览器截图或手动复制页面数据。');
  }
}
function pickImport() { $('#fileInput').click(); }
function handleFile(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onerror = function () { alert('文件读取失败，请重试。'); };
  fr.onload = function () {
    var obj;
    try { obj = JSON.parse(String(fr.result)); }
    catch (e) { alert('这不是有效的 JSON 备份文件，未写入任何数据。'); return; }
    var norm = normalize(obj);
    var known = ARRAYS.some(function (k) { return Array.isArray(obj[k]); }) || (obj && obj.fit && Array.isArray(obj.fit.logs));
    if (!obj || typeof obj !== 'object' || !known) {
      alert('备份结构无法识别（缺少 tx/habits/fit/events/wish/media 任一数据段），未写入任何数据。');
      return;
    }
    confirmImport(norm);
  };
  fr.readAsText(file, 'utf-8');
}
function confirmImport(inc) {
  var mode = 'merge';
  var counts = [

function computeIndex() {
  var parts = [], mk = curMonth(), t = today();

  if (budget > 0) {

    parts.push({ k: '预算健康', w: 0.3, v: clamp((1 - used) * 100, 0, 100), note: '已用 ' + Math.round(used * 100) + '%' });
  }
  if (S.habits.length) {
    var doneH = S.habits.filter(function (hb) { return habitDone(hb, t); }).length;
    parts.push({ k: '习惯完成', w: 0.3, v: doneH / S.habits.length * 100, note: doneH + '/' + S.habits.length });
  }
  var todayEv = S.events.filter(function (e) { return e.date === t; });

  }

        ARRAYS.forEach(function (k) { S[k] = S[k].filter(function (x) { if (x && x.demo) { n++; return false; } return true; }); });
        S.fit.logs = S.fit.logs.filter(function (x) { if (x && x.demo) { n++; return false; } return true; });
        S.meta.demo = false;
        commit();
        alert(n ? '已清空 ' + n + ' 条演示数据。' : '没有标记为演示的数据。当前数据来自你自己或导入的备份，如需全部清空请使用「清空全部数据」。');
      } }, icon('trash'), '清空演示数据'),
      h('button', { class: 'btn danger', type: 'button', onclick: function () {
        confirmDialog('将清空全部本地数据（含收支、习惯、健身、日程、待买、收藏），且无法撤销。建议先导出备份。', function () {
          S = blankState(); persistNow(); render();
        }, '确认清空');
      } }, icon('alert'), '清空全部数据')
    ),
    h('div', { class: 'hair' }),
    h('p', { style: 'font-size:12px;color:var(--muted);margin:0', text: '全部数据保存在当前浏览器的 localStorage，不上传服务器。清理浏览器数据、更换浏览器或设备会导致数据丢失，请定期导出 JSON 备份。' }),
    h('p', { style: 'font-size:12px;color:var(--muted);margin:0', text: '上次备份：' + (S.meta.lastBackup ? S.meta.lastBackup.slice(0, 19).replace('T', ' ') : '从未备份') + ' · 未备份新增：' + num(S.meta.addedSinceBackup, 0) + ' 条' })
  );
  openDialog({
    title: '设置与数据',
    body: body,
    okText: '保存设置',
    onOk: function () { S.profile.monthlyBudget = Math.max(0, num(bIn.value, 0)); this.close(); commit(); }
  });
}
function quickAddDialog() {
  var items = [
    ['记一笔收支', 'coin', txDialog],
    ['新增习惯', 'heart', function () { habitDialog(null); }],
    ['记录体重', 'pulse', fitDialog],
    ['新增日程', 'cal', eventDialog],
    ['加入待买', 'cart', wishDialog],
    ['收藏书影音', 'book', function () { mediaDialog(null); }]
  ];
  var grid = h('div', { class: 'split c3' });
  items.forEach(function (it) {
    grid.append(h('button', {
      class: 'btn', type: 'button', style: 'justify-content:flex-start;padding:12px 14px',
      onclick: function () { dlg.close(); UI.tab = ({ 记一笔收支: 'finance', 新增习惯: 'habits', 记录体重: 'fitness', 新增日程: 'schedule', 加入待买: 'wish', 收藏书影音: 'media' })[it[0]]; it[2](); }
    }, icon(it[1], 'ic-lg'), h('span', { text: it[0] })));
  });
  var dlg = openDialog({ title: '快速新增', body: grid, okText: null, cancelText: '关闭' });
  return dlg;
}

/* =========================================================
   启动
   ========================================================= */
loadState();
$('#btnQuick').addEventListener('click', quickAddDialog);
$('#btnExport').addEventListener('click', exportJSON);
$('#btnImport').addEventListener('click', pickImport);
$('#btnSettings').addEventListener('click', settingsDialog);
$('#fileInput').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (f) handleFile(f);
  e.target.value = '';
});
window.addEventListener('pagehide', flushPending);
document.addEventListener('visibilitychange', function () { if (document.hidden) flushPending(); });
window.addEventListener('beforeunload', flushPending);
render();

})();
</script>
</body>
</html>
