[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "doocs-md-py"
version = "0.1.0"
description = "doocs/md 的 Python 3.14 复刻：微信兼容 Markdown 渲染库 + 自托管 API + 13 图床上传器 + MCP/CLI"
requires-python = ">=3.14"
license = { text = "WTFPL" }
authors = [{ name = "doocs-md-py contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "nh3>=0.2.20",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
mdpy = "doocs_md_py.cli:main"

[tool.scikit-build]
# scikit-build-core 对 wheel.packages 指向的包目录默认整体打包（含 *.css/*.txt
# 等非 .py 资产，无需 setuptools 式 package-data）
wheel.packages = ["src/doocs_md_py"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# 编辑器即时红线：禁止 __future__ 导入（Python 3.14 其全部特性均已默认，
# 含 PEP 649 惰性注解；PEP 563 样板冗余且语义有别）。
# 运行期硬兜底见 tests/test_no_future_annotations.py。
[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID251"]
ignore = ["E741"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "Python 3.14 已默认 PEP 649 惰性注解，禁止 __future__ 导入（PEP 563 样板冗余）" }

[tool.coverage.run]
source = ["doocs_md_py"]
branch = true

[tool.coverage.report]
# AC-16 总覆盖率门槛（pytest 内快速拦截）；关键模块 per-module ≥90% 由
# scripts/check_coverage.py 消费 --cov-report=json 产物做机械判定。
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
