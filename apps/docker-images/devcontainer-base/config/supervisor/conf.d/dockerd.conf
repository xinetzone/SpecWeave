[program:dockerd]
user=root
command=/usr/bin/dockerd --log-level=error
directory=/
autorestart=true
startretries=5
startsecs=15
priority=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8"
stopsignal=SIGTERM
stopwaitsecs=30
