# =============================================================================
# condarc-performant.yaml — 性能优化版 .condarc 模板（conda-forge only, libmamba）
#
# 用途：Docker 构建 / CI 环境中 conda 环境的高性能配置
# 优化项：8线程并行下载/解压、网络超时重试、strict channel priority、libmamba solver
#
# 用法（Dockerfile 中直接 COPY）：
#   COPY variants/shared/config/condarc/condarc-performant.yaml /root/.condarc
#
# 用法（本地/CI 使用）：
#   cp condarc-performant.yaml ~/.condarc
#   conda config --set solver libmamba   # 脚本方式可自动设置
#
# 可调参数（根据环境修改）：
#   repodata_threads / execute_threads: 并行线程数（建议=CPU核心数，Docker构建推荐8）
#   remote_connect_timeout_secs: 连接超时（秒）
#   remote_read_timeout_secs: 读取超时（秒，大环境包可能需要更长）
#   remote_max_retries: 最大重试次数
#   channels: 镜像源URL（替换为国内镜像可加速）
#
# 国内镜像替换 channels.URL：
#   清华 tuna:  https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
#   阿里 aliyun: https://mirrors.aliyun.com/anaconda/cloud/conda-forge/
# =============================================================================

channels:
  - conda-forge
channel_priority: strict
show_channel_urls: false

# ── 网络调优 ──
remote_connect_timeout_secs: 30
remote_read_timeout_secs: 120
remote_max_retries: 5
remote_backoff_factor: 3
ssl_verify: true

# ── 性能核心：并行线程数 ──
# repodata_threads: 并行下载 repodata.json 的线程数
# execute_threads: 并行安装/解压包的线程数
# 默认值 1（串行），在多核CPU/高带宽网络环境下建议设为 4-16
repodata_threads: 8
execute_threads: 8

# ── Solver ──
# 使用 conda config --set solver libmamba 命令设置（不在文件中直接指定以兼容不同版本）
