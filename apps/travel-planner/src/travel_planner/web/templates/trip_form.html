{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}{{ '编辑行程' if trip else '新建行程' }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{{ '编辑行程' if trip else '新建行程' }}</h1>
</div>
<form method="post" action="{{ '/trips/%s/edit'|format(trip.id) if trip else '/trips' }}" class="panel form">
  {{ m.csrf() }}
  <div class="field">
    <label>名称 <em>*</em></label>
    <input name="name" required maxlength="200" value="{{ trip.name if trip else '' }}" placeholder="如：杭州国庆 7 日">
  </div>
  <div class="field-row">
    <div class="field">
      <label>目的地</label>
      <input name="destination" maxlength="200" value="{{ trip.destination if trip else '' }}" placeholder="如：杭州">
    </div>
    <div class="field">
      <label>状态</label>
      <select name="status">
        {% for s in TRIP_STATUSES %}
        <option value="{{ s }}" {{ 'selected' if trip and trip.status == s }}>{{ TRIP_STATUS_LABELS[s] }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label>开始日期</label>
      <input type="date" name="start_date" value="{{ trip.start_date if trip else '' }}">
    </div>
    <div class="field">
      <label>结束日期</label>
      <input type="date" name="end_date" value="{{ trip.end_date if trip else '' }}">
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label>总预算（可选）</label>
      <input name="budget_total" inputmode="decimal" value="{{ fmt_money(trip.budget_total) if trip and trip.budget_total is not none else '' }}" placeholder="如 8000">
    </div>
    <div class="field">
      <label>币种（展示用）</label>
      <input name="currency" maxlength="8" value="{{ trip.currency if trip else 'CNY' }}">
    </div>
  </div>
  <div class="field">
    <label>备注</label>
    <textarea name="notes" rows="3" maxlength="2000" placeholder="同伴、主题、注意事项…">{{ trip.notes if trip else '' }}</textarea>
  </div>
  <div class="form-actions">
    <a class="btn ghost" href="{{ '/trips/%s'|format(trip.id) if trip else '/trips' }}">取消</a>
    <button class="btn primary" type="submit">保存</button>
  </div>
</form>
{% endblock %}
