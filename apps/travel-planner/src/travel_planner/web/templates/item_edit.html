{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}编辑条目{% endblock %}
{% block content %}
<div class="page-head">
  <h1>编辑条目 · {{ trip.name }}</h1>
</div>
<form method="post" action="/trips/{{ trip.id }}/items/{{ item.id }}/edit" class="panel form">
  {{ m.csrf() }}
  <div class="field-row">
    <div class="field">
      <label>第几天（1~{{ days_max|default(365) }}）</label>
      <input name="day_index" inputmode="numeric" required value="{{ item.day_index }}">
    </div>
    <div class="field">
      <label>类型</label>
      <select name="type">
        {% for t in ITEM_TYPES %}
        <option value="{{ t }}" {{ 'selected' if item.type == t }}>{{ ITEM_TYPE_LABELS[t] }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="field">
    <label>标题 <em>*</em></label>
    <input name="title" required maxlength="120" value="{{ item.title }}">
  </div>
  <div class="field-row">
    <div class="field"><label>开始时间</label><input type="time" name="start_time" value="{{ item.start_time }}"></div>
    <div class="field"><label>结束时间</label><input type="time" name="end_time" value="{{ item.end_time }}"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>地点</label><input name="location" maxlength="200" value="{{ item.location }}"></div>
    <div class="field"><label>费用（可选）</label><input name="cost" inputmode="decimal" value="{{ fmt_money(item.cost) if item.cost is not none else '' }}"></div>
  </div>
  <div class="field"><label>备注</label><textarea name="notes" rows="3" maxlength="2000">{{ item.notes }}</textarea></div>
  <div class="form-actions">
    <a class="btn ghost" href="/trips/{{ trip.id }}">取消</a>
    <button class="btn primary" type="submit">保存</button>
  </div>
</form>
{% endblock %}
