[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "inurl-byok-token-hub"
version = "0.1.0"
description = "BYOK 统一令牌枢纽复刻（Python 3.14+）：E2EE 密钥托管 + 本地 OpenAI 兼容代理 + 逻辑别名路由 + 故障切换"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "SpecWeave" }]
keywords = ["byok", "token-hub", "ai-gateway", "openai-compatible", "e2ee"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "cryptography>=46",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
inurl-byok-token-hub = "inurl_byok_token_hub.cli:app"

[tool.scikit-build]
wheel.packages = ["src/inurl_byok_token_hub"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["inurl_byok_token_hub"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "S",   # flake8-bandit (security)
  "TID251",
]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # assert allowed in this project
  "B008",  # function calls in default args
]
unfixable = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S105",  # 测试用假凭证
  "S106",  # 测试用假口令参数名
  "S101",  # 断言
  "B017",  # 断言异常类型时用宽泛基类覆盖多实现
  "S104",  # 测试「拒绝 0.0.0.0」必须写该字面量
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__" = { msg = "Python 3.14 已默认 PEP 649 惰性注解，禁止 __future__ 导入" }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
