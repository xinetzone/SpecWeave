    <g>
      <circle cx="183" cy="153" r="30" fill="#f7f6f2" stroke="#1a2a9c" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="183" y="159">治理</text>
    </g>
  </g>

  <!-- 标注 -->
  <g font-family="ui-monospace,monospace" font-size="9.5" fill="#6b7078" letter-spacing="1.4">
    <text x="40" y="52">AGENTS.md</text>
    <text x="40" y="68" fill="#8b9098">→ 角色 → 协议 → 门禁</text>
    <text x="680" y="512" text-anchor="end">ROLE MAP / 08</text>
