<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="多智能体协作示意图">
  <defs>
    <linearGradient id="hl-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b45d8" stop-opacity="0.16"/>
