    <path d="M360 280L537 153"/>
    <path d="M360 280L610 280"/>
    <path d="M360 280L537 407"/>
    <path d="M360 280L360 460"/>
    <path d="M360 280L183 407"/>
    <path d="M360 280L110 280"/>
    <path d="M360 280L183 153"/>
  </g>
  <g stroke="#1a2a9c" stroke-opacity="0.16" stroke-width="1">
    <path d="M360 100L537 153M537 153L610 280M610 280L537 407M537 407L360 460M360 460L183 407M183 407L110 280M110 280L183 153M183 153L360 100"/>
  </g>

  <!-- 中心节点 -->
  <g>
