    </linearGradient>
  </defs>

  <!-- 背景网格 -->
  <g stroke="#14161a" stroke-opacity="0.07" stroke-width="1">
    <path d="M40 0V560M80 0V560M120 0V560M160 0V560M200 0V560M240 0V560M280 0V560M320 0V560M360 0V560M400 0V560M440 0V560M480 0V560M520 0V560M560 0V560M600 0V560M640 0V560M680 0V560"/>
    <path d="M0 40H720M0 80H720M0 120H720M0 160H720M0 200H720M0 240H720M0 280H720M0 320H720M0 360H720M0 400H720M0 440H720M0 480H720M0 520H720"/>
  </g>

  <!-- 角标 -->
  <g stroke="#14161a" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <path d="M28 28h26M28 28v26"/>
    <path d="M692 28h-26M692 28v26"/>
    <path d="M28 532h26M28 532v-26"/>
    <path d="M692 532h-26M692 532v-26"/>
  </g>

  <!-- 外环 -->
  <ellipse cx="360" cy="280" rx="252" ry="182" fill="none" stroke="#1a2a9c" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 7"/>
  <ellipse cx="360" cy="280" rx="196" ry="140" fill="none" stroke="#1a2a9c" stroke-opacity="0.14" stroke-width="1"/>

  <!-- 连线 -->
  <g stroke="#1a2a9c" stroke-opacity="0.34" stroke-width="1.1">
