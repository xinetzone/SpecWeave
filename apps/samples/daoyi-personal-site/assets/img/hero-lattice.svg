    <text x="360" y="296" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#6b7078" letter-spacing="2">PROTOCOL</text>
  </g>

  <!-- 角色节点 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" text-anchor="middle" fill="#14161a">
    <g>
      <circle cx="360" cy="100" r="30" fill="#f7f6f2" stroke="#1a2a9c" stroke-opacity="0.4" stroke-width="1.2"/>
