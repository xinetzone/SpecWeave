<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="规则验证沉淀闭环示意">
  <ellipse cx="380" cy="230" rx="290" ry="168" fill="none" stroke="#1a2a9c" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 8"/>

  <!-- 循环箭头 -->
  <g fill="none" stroke="#1a2a9c" stroke-opacity="0.42" stroke-width="1.6" stroke-linecap="round">
    <path d="M262 118C330 62 452 66 512 122"/>
    <path d="M540 176C586 236 556 314 486 346"/>
    <path d="M430 366C350 400 254 364 226 300"/>
    <path d="M210 244C182 188 208 128 252 112"/>
  </g>
  <g fill="#1a2a9c" fill-opacity="0.5">
    <path d="M512 122l-11-7 3 14z"/>
    <path d="M486 346l-12 6 12 6z"/>
    <path d="M226 300l11 8-3-14z"/>
    <path d="M252 112l12-6-12-6z"/>
  </g>

  <!-- 节点 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g>
      <circle cx="222" cy="140" r="52" fill="#ffffff" fill-opacity="0.9" stroke="#1a2a9c" stroke-opacity="0.45" stroke-width="1.3"/>
      <text x="222" y="136" font-size="21" font-weight="500" fill="#14161a">规则</text>
      <text x="222" y="156" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">RULE</text>
    </g>
    <g>
      <circle cx="540" cy="140" r="52" fill="#ffffff" fill-opacity="0.9" stroke="#1a2a9c" stroke-opacity="0.45" stroke-width="1.3"/>
      <text x="540" y="136" font-size="21" font-weight="500" fill="#14161a">验证</text>
      <text x="540" y="156" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">VERIFY</text>
    </g>
    <g>
      <circle cx="380" cy="350" r="56" fill="#efb03f" fill-opacity="0.42" stroke="#8a5d08" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="380" y="346" font-size="21" font-weight="500" fill="#14161a">沉淀</text>
      <text x="380" y="366" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">DISTILL</text>
    </g>
  </g>

  <!-- 中心 -->
  <g>
    <circle cx="380" cy="230" r="76" fill="#ffffff" fill-opacity="0.6" stroke="#1a2a9c" stroke-opacity="0.22" stroke-width="1"/>
    <text x="380" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#14161a" letter-spacing="1">可执行</text>
    <text x="380" y="238" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#14161a" letter-spacing="1">可验收</text>
    <text x="380" y="262" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#14161a" letter-spacing="1">可复用</text>
  </g>

  <g font-family="ui-monospace,monospace" font-size="9.5" fill="#6b7078" letter-spacing="1.3">
    <text x="36" y="40">THE LOOP</text>
    <text x="724" y="40" text-anchor="end">RULE → VERIFY → DISTILL → REVIEW</text>
    <text x="36" y="432">REPEATABLE BY DESIGN</text>
  </g>
</svg>
