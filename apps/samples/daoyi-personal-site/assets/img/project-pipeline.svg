  <!-- 底部回流 -->
  <g stroke="#4a3596" stroke-opacity="0.3" stroke-width="1.1" fill="none" stroke-dasharray="5 6">
    <path d="M618 382V438H130V474"/>
  </g>
  <g fill="#4a3596" fill-opacity="0.5">
    <path d="M125 474l5-8 5 8z"/>
