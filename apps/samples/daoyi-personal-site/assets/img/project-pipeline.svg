    <circle cx="540" cy="200" r="11" fill="#1f6f6b" fill-opacity="0.18" stroke="#1f6f6b" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M534 200l4.5 4.5 8-9" fill="none" stroke="#14504d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
