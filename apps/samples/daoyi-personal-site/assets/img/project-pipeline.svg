  <g stroke="#4a3596" stroke-opacity="0.38" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M440 99H496M440 217H496M440 335H496"/>
  </g>
  <g fill="#4a3596" fill-opacity="0.55">
    <path d="M496 94l8 5-8 5zM496 212l8 5-8 5zM496 330l8 5-8 5z"/>
