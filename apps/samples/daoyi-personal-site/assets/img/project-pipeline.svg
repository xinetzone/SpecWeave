    <text x="374" y="452" text-anchor="middle" fill="#8b9098">KNOWLEDGE LOOPS BACK INTO SPEC</text>
    <text x="724" y="502" text-anchor="end">TRACEABLE OUTPUT</text>
  </g>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8b9098">
    <text x="36" y="546">私域内容留在本地工作区，公开内容才进入知识库与索引</text>
  </g>
