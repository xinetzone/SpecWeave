    <text x="536" y="254" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7078">问答带引用跳转</text>
  </g>
  <g>
    <rect x="512" y="288" width="212" height="94" rx="11" fill="#ffffff" fill-opacity="0.88" stroke="#4a3596" stroke-opacity="0.36" stroke-width="1.1"/>
    <circle cx="540" cy="318" r="11" fill="#1f6f6b" fill-opacity="0.18" stroke="#1f6f6b" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M534 318l4.5 4.5 8-9" fill="none" stroke="#14504d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="562" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#14161a">回流规范的素材</text>
    <text x="562" y="334" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1">FEEDS BACK TO SPEC</text>
    <path d="M536 356H700" stroke="#4a3596" stroke-opacity="0.18" stroke-width="1"/>
    <text x="536" y="372" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7078">新事实补进知识包</text>
