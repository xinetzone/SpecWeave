<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-label="四步工作闭环示意">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#14161a" fill-opacity="0.5"/>
    </marker>
  </defs>

  <!-- 外环刻度 -->
  <g stroke="#14161a" stroke-opacity="0.18" stroke-width="1">
    <path d="M360 42V56M360 544V558M122 300H136M584 300H598"/>
    <path d="M188 128L198 138M532 128L522 138M188 472L198 462M532 472L522 462"/>
  </g>

  <!-- 环形箭头 -->
  <g fill="none" stroke="#14161a" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M446 146A196 196 0 0 1 540 250"/>
    <path d="M540 350A196 196 0 0 1 446 454"/>
    <path d="M274 454A196 196 0 0 1 180 350"/>
    <path d="M180 250A196 196 0 0 1 274 146"/>
  </g>

  <!-- 四节点 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g>
      <circle cx="360" cy="118" r="56" fill="#ffffff" fill-opacity="0.95" stroke="#14161a" stroke-opacity="0.28" stroke-width="1.3"/>
      <text x="360" y="126" font-size="26" font-weight="500" fill="#14161a">立</text>
      <text x="360" y="148" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">RULE</text>
    </g>
    <g>
      <circle cx="542" cy="300" r="56" fill="#ffffff" fill-opacity="0.95" stroke="#14161a" stroke-opacity="0.28" stroke-width="1.3"/>
      <text x="542" y="308" font-size="26" font-weight="500" fill="#14161a">验</text>
      <text x="542" y="330" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">VERIFY</text>
    </g>
    <g>
      <circle cx="360" cy="482" r="56" fill="#efb03f" fill-opacity="0.45" stroke="#8a5d08" stroke-opacity="0.5" stroke-width="1.3"/>
      <text x="360" y="490" font-size="26" font-weight="500" fill="#14161a">沉</text>
      <text x="360" y="512" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">DISTILL</text>
    </g>
    <g>
      <circle cx="178" cy="300" r="56" fill="#ffffff" fill-opacity="0.95" stroke="#14161a" stroke-opacity="0.28" stroke-width="1.3"/>
      <text x="178" y="308" font-size="26" font-weight="500" fill="#14161a">复</text>
      <text x="178" y="330" font-family="ui-monospace,monospace" font-size="9" fill="#8b9098" letter-spacing="1.2">REVIEW</text>
    </g>
  </g>

  <!-- 中心 -->
  <g>
    <circle cx="360" cy="300" r="94" fill="#f6f5f1"/>
    <circle cx="360" cy="300" r="94" fill="none" stroke="#14161a" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="360" cy="272" r="30" fill="#14161a"/>
    <text x="360" y="281" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#f6f5f1">道一</text>
    <text x="360" y="330" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#6b7078" letter-spacing="1.2">DAOYI</text>
    <text x="360" y="352" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8b9098">同一套方法，四步循环</text>
  </g>

  <!-- 连接中心与节点 -->
  <g stroke="#14161a" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 6">
    <path d="M360 174V206M360 394V426M476 300H542M244 300H178"/>
  </g>

  <g font-family="ui-monospace,monospace" font-size="9.5" fill="#6b7078" letter-spacing="1.3">
    <text x="40" y="48">WORKING LOOP</text>
    <text x="680" y="48" text-anchor="end">2026</text>
    <text x="40" y="566">RULE → VERIFY → DISTILL → REVIEW → RULE</text>
  </g>
</svg>
