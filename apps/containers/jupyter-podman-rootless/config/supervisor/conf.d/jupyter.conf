[program:jupyter]
user=devuser
command=/opt/conda/envs/main/bin/jupyter lab --config=/home/devuser/.jupyter/jupyter_notebook_config.py
directory=/workspace
autorestart=true
startretries=3
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false
; CONTAINER_HOST / XDG_RUNTIME_DIR 一律用 %(ENV_x)s 继承 entrypoint.sh::setup_podman() 导出的
; 动态值，严禁硬编码 /run/user/<uid>（devuser UID 由镜像 useradd 动态分配，可能为 1000/1001/...）。
; supervisord 会在变量缺失时直接拒绝启动本子进程，故 entrypoint 两条分支都无条件导出这两个变量。
environment=HOME="/home/devuser",USER="devuser",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8",CONDA_DEFAULT_ENV="main",PATH="/opt/conda/envs/main/bin:/opt/conda/bin:/usr/local/bin:/usr/bin:/bin",CONTAINER_HOST="%(ENV_CONTAINER_HOST)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
