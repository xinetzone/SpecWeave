[program:jupyter]
user=devuser
command=/opt/conda/envs/main/bin/jupyter lab --config=/home/devuser/.jupyter/jupyter_notebook_config.py
directory=/workspace
autorestart=true
startretries=3
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false
environment=HOME="/home/devuser",USER="devuser",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8",CONDA_DEFAULT_ENV="main",PATH="/opt/conda/envs/main/bin:/opt/conda/bin:/usr/local/bin:/usr/bin:/bin",CONTAINER_HOST="unix:///run/user/1001/podman/podman.sock",XDG_RUNTIME_DIR="/run/user/1001"
