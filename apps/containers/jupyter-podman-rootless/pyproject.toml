[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "jupyter-podman-rootless"
version = "0.1.0"
description = "基于Podman rootless的Jupyter开发容器（Python 3.14t + Miniforge3 + SSH + Podman + OMLMD + OLOT ModelCar + Toolbx兼容透传模式）"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "invoke>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sdk = ["podman>=5.0.0"]
compose = ["podman-compose>=1.0.0"]
full = ["podman>=5.0.0", "podman-compose>=1.0.0"]
model = ["omlmd>=0.2.0", "olot[oras-py]>=0.2.0"]

[tool.scikit-build]
wheel.packages = ["tasks"]
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.scikit-build.cmake]
build-type = "Release"
args = ["-G", "Ninja"]

[tool.invoke]
package = "tasks"
