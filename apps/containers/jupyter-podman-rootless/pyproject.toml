[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-podman-rootless"
version = "0.1.0"
description = "基于Podman rootless的Jupyter开发容器（Python 3.14t + Miniforge3 + SSH + Podman）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "invoke>=2.0",
]

[project.optional-dependencies]
sdk = ["podman>=5.0.0"]

[tool.setuptools]
py-modules = []

[tool.invoke]
package = "tasks"
