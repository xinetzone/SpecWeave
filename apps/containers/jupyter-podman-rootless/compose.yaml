---
# Jupyter Podman Rootless - Compose Specification
# Compatible with podman-compose (daemon-less, rootless-first)
# Usage:
#   1. Copy .env.example to .env and configure
#   2. podman-compose up -d
#   3. With local model registry: podman-compose --profile registry up -d
#   4. With dev tools pass-through: podman-compose -f compose.yaml -f compose.dev.yaml up -d
#   5. Or use `invoke run` for enhanced experience (auto password generation, WSL2 path handling)
#
# ── Toolbx-style Host Resource Pass-through ─────────────────────────
# Philosophy: "pass-through over isolation" for development environments.
# Uncomment the blocks below OR use compose.dev.yaml override for deeper
# host integration (SSH agent, git config, GUI apps, GPU, /run/host escape hatch).
# See: https://containertoolbx.org/  (Toolbx pass-through design reference)

name: jupyter-podman-rootless

services:
  jupyter:
    container_name: ${CONTAINER_NAME:-jupyter-podman}
    build:
      context: .
      dockerfile: Containerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-official}
        CONDA_MIRROR: ${CONDA_MIRROR:-official}
        PIP_MIRROR: ${PIP_MIRROR:-official}
    image: ${IMAGE_TAG:-jupyter-podman-rootless:latest}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${JUPYTER_PORT:-8888}:8888"
    # ── Host network mode (alternative to port mapping, Toolbx-style) ──
    # Uncomment to use host network (no port mapping needed, access host services directly):
    # network_mode: host
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace
      # ── B-scheme: 直连宿主 rootless daemon（绕过嵌套 userns）──
      # 宿主 socket 在同一绝对路径上 bind-mount 进容器（host 与 container 路径
      # 均取自 HOST_PODMAN_SOCK），entrypoint 据此在 devuser 可控目录内建立
      # 符号链接并设置 CONTAINER_HOST，使容器内 podman SDK/CLI 复用宿主 daemon。
      # 默认 uid=1000（WSL2 常见），非 1000 宿主 UID 时覆盖 HOST_PODMAN_SOCK。
      - ${HOST_PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/run/user/1000/podman/podman.sock
      # ── Dev pass-through mounts (uncomment to enable) ──
      # SSH agent for git operations inside container (Toolbx-style):
      # - ${SSH_AUTH_SOCK:-/dev/null}:/tmp/ssh-auth.sock:ro
      # Git config (read-only, no need to reconfigure git in container):
      # - ${HOME:-/home/user}/.gitconfig:/home/devuser/.gitconfig:ro
      # SSH keys (read-only, for git+ssh operations):
      # - ${HOME:-/home/user}/.ssh:/home/devuser/.ssh:ro
      # X11 socket for GUI apps (firefox, matplotlib interactive, etc.):
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland socket for GUI apps:
      # - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/wayland-0:ro
      # /run/host escape hatch (access host filesystem, Toolbx-style):
      # - /:/run/host:rslave
      # Host DNF/Pip cache to speed up package installs:
      # - ${HOME:-/home/user}/.cache/pip:/home/devuser/.cache/pip
    devices:
      - /dev/fuse:/dev/fuse
      # ── GPU/device pass-through (uncomment to enable) ──
      # Intel/AMD GPU (Mesa, /dev/dri):
      # - /dev/dri:/dev/dri
      # NVIDIA GPU (requires NVIDIA Container Toolkit / CDI):
      #   For CDI (recommended): add to container config via `podman container runlabel`
      #   Or use nvidia.com/gpu: all with nvidia-ctk configured
      # USB devices (for hardware access):
      # - /dev/bus/usb:/dev/bus/usb
    security_opt:
      - label=disable
    cgroupns: host
    # ── ulimits (uncomment for large builds/ML workloads, Toolbx-style) ──
    # ulimits:
    #   nofile:
    #     soft: 65536
    #     hard: 65536
    environment:
      USER_PASSWORD: ${USER_PASSWORD:-changeme}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
      GRANT_SUDO: ${GRANT_SUDO:-no}
      # ── B-scheme: 容器内 podman SDK/CLI 复用宿主 daemon（见 volumes 注释）──
      HOST_PODMAN_SOCK: ${HOST_PODMAN_SOCK:-/run/user/1000/podman/podman.sock}
      # ── Dev pass-through env vars (uncomment to enable) ──
      # SSH agent socket path (must match volume mount above):
      # SSH_AUTH_SOCK: /tmp/ssh-auth.sock
      # X11/Wayland for GUI apps:
      # DISPLAY: ${DISPLAY:-:0}
      # WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      # XDG_RUNTIME_DIR: /tmp/runtime
      # QT_X11_NO_MITSHM: "1"
    restart: unless-stopped
    # tty: true  # uncomment for interactive shell debugging

  # Local OCI registry for ML model storage (OMLMD)
  # Start with: podman-compose --profile registry up -d
  # Access from host: localhost:${REGISTRY_PORT:-5000}
  # Access from jupyter container: http://model-registry:${REGISTRY_PORT:-5000}
  model-registry:
    image: registry:2
    profiles: ["registry"]
    container_name: ${CONTAINER_NAME:-jupyter-podman}-registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
    restart: unless-stopped

volumes:
  registry-data:
