---
# Jupyter Podman Rootless - Compose Specification
# Compatible with podman-compose (daemon-less, rootless-first)
# Usage:
#   1. Copy .env.example to .env and configure
#   2. podman-compose up -d
#   3. With local model registry: podman-compose --profile registry up -d
#   4. Or use `invoke run` for enhanced experience (auto password generation, WSL2 path handling)

name: jupyter-podman-rootless

services:
  jupyter:
    container_name: ${CONTAINER_NAME:-jupyter-podman}
    build:
      context: .
      dockerfile: Containerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-official}
        CONDA_MIRROR: ${CONDA_MIRROR:-official}
        PIP_MIRROR: ${PIP_MIRROR:-official}
    image: ${IMAGE_TAG:-jupyter-podman-rootless:latest}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - label=disable
    cgroupns: host
    environment:
      USER_PASSWORD: ${USER_PASSWORD:-changeme}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
      GRANT_SUDO: ${GRANT_SUDO:-no}
    restart: unless-stopped
    # tty: true  # uncomment for interactive shell debugging

  # Local OCI registry for ML model storage (OMLMD)
  # Start with: podman-compose --profile registry up -d
  # Access from host: localhost:${REGISTRY_PORT:-5000}
  # Access from jupyter container: http://model-registry:${REGISTRY_PORT:-5000}
  model-registry:
    image: registry:2
    profiles: ["registry"]
    container_name: ${CONTAINER_NAME:-jupyter-podman}-registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
    restart: unless-stopped

volumes:
  registry-data:
