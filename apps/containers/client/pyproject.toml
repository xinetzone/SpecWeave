[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "jupyter-podman-client"
version = "0.1.0"
description = "jupyter-podman-rootless 镜像消费端：基于 podman-py 从本地加载镜像并管理容器生命周期"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "invoke>=2.0",
    "jpman-common",
    "podman>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# quant.* 工作负载栈命名空间需要（podman-compose 声明式编排器）；
# 仅使用 load/run/stop 等 SDK→CLI 命令的核心用户无需安装。
compose = ["podman-compose>=1.0.0"]

[tool.scikit-build]
wheel.packages = ["src/jpman_client"]
wheel.cmake = false
build.verbose = false
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"

[tool.invoke]
package = "jpman_client.tasks"
