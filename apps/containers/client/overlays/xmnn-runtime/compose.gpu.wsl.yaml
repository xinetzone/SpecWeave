---
# xmnn-runtime GPU opt-in 覆盖层 · WSL2 形态（由 invoke 按 GPU 设备形态自动选择）
#
# 加载条件（overlay_core.gpu_override_file）：resolved 形态为 `wsl` 且本文件存在。
# 触发路径——未显式设 GPU_DEVICE 时自动探测到 /dev/dxg（podman-machine-default /
# WSL2 发行版内无 /dev/dri，2026-09-20 实测）。与 compose.gpu.yaml **互斥**：
# 两个同加载会让 devices 列表出现重复项，故由内核只选其一。
#
# 为什么需要本文件（2026-09-20 两轮实测，与 xmnn-dev 同源结论）：
#   第一轮（判据 = CDLL("libcuda.so.1") 能否加载）：
#     --device /dev/dxg 单独                            → CDLL 失败
#     -v /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro           → 失败（未配合 LD_LIBRARY_PATH）
#     仅设 LD_LIBRARY_PATH=/usr/lib/wsl/lib             → 失败（容器内无该文件）
#     --device /dev/dxg + 单文件挂 libcuda.so.1         → CDLL OK
#   ⚠️ 第二轮（判据 = cuInit / cuda.is_available）：
#   **「CDLL OK」≠「设备可见」**——仅挂单文件时 cuInit 返回 100
#   (CUDA_ERROR_NO_DEVICE)、cuDriverGetVersion 亦 100，而宿主 WSL 侧
#   nvidia-smi 完全正常。逐项差分定位到**两处缺失**：
#     + 单文件挂 libdxcore.so（libcuda 经 /dev/dxg 通信的 DXCore 桥接库）
#     + 目录挂 /usr/lib/wsl/drivers（Windows 驱动库目录，libcuda 初始化时扫描）
#   → cuInit rc=0、cuDeviceGetCount=1  ✅
#   排除项：--cap-add SYS_ADMIN 无效；--security-opt seccomp=unconfined 无效；
#   --privileged 有效但**非必要**——本形态零特权即可。
# 三条 bind（libcuda + libdxcore + drivers）同为最小充分条件：/dev/dxg 只是
# 半虚拟化通道，libcuda 由 WSL 宿主提供。**刻意不设 LD_LIBRARY_PATH**——目标取
# 基底（Ubuntu 系）glibc 默认搜索目录 /usr/lib，本栈**本就无 environment 段**
# （交付语义 = 干净运行时），任何 LD_LIBRARY_PATH 注入都会凭空新增栈专属 env，
# 既污染交付语义又打挂 test_compose_merge 的 env 黄金集（C26）。
#
# 用法：
#   invoke xmnnrt.up --gpu            # 自动形态判定（宿主无 /dev/dri 时走本文件）
#   podman-compose -f compose.yaml -f compose.gpu.wsl.yaml up -d

services:
  xmnnrt:
    devices:
      - /dev/dxg
    volumes:
      # 单文件只读挂载，目标取 /usr/lib（基底默认库搜索目录，无需 LD_LIBRARY_PATH）。
      # create_host_path: false —— 宿主缺失即报错，绝不让 podman 误建空文件
      # （内核 resolve_gpu_device 已前置校验该路径存在）。
      - type: bind
        source: /usr/lib/wsl/lib/libcuda.so.1
        target: /usr/lib/libcuda.so.1
        read_only: true
        bind:
          create_host_path: false
      # DXCore 桥接库：缺它时 libcuda 能加载但枚举不到设备（cuInit=100 NO_DEVICE）
      - type: bind
        source: /usr/lib/wsl/lib/libdxcore.so
        target: /usr/lib/libdxcore.so
        read_only: true
        bind:
          create_host_path: false
      # Windows 驱动库目录：libcuda 初始化时扫描此路径，缺它同样 cuInit=100
      - type: bind
        source: /usr/lib/wsl/drivers
        target: /usr/lib/wsl/drivers
        read_only: true
        bind:
          create_host_path: false