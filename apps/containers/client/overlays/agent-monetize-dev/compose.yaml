---
# agent-monetize-dev 叠加栈 - Compose Specification（podman-compose / rootless）
#
# 本文件由 client-overlay-scaffold 骨架生成（第四栈复制本文件模式时，
# 同样继承 ../_shared/base-rootless.yaml，替换栈专属字段即可）。
#
# 设计依据（不可变，详见技能 SKILL.md §7）：
#   rootless 三必需、凭证四变量、network_mode bridge 已上移
#   ../_shared/base-rootless.yaml（extends 单一事实源）；严禁 privileged。
#   bind 一律长语法 + create_host_path（G1）。
#
# 两种驱动：① invoke monetize.*（apps/containers/client 下；extends.file
#             由 podman-compose 按本文件目录重写解析，任意 cwd 均可）；
#           ② 裸 podman-compose（须在本目录内执行，cp .env.example .env）。

name: agent-monetize-dev

services:
  monetize:
    extends:
      file: ../_shared/base-rootless.yaml
      service: rootless-base
    container_name: ${MONETIZE_CONTAINER_NAME:-agent-monetize-dev}
    image: ${MONETIZE_IMAGE_TAG:-localhost/agent-monetize-dev:latest}
    build:
      context: .
      dockerfile: Containerfile.agent-monetize
      args:
        BASE_IMAGE: ${BASE_IMAGE:-localhost/jupyter-podman-rootless:latest}
        PIP_MIRROR: ${PIP_MIRROR:-official}
    ports:
      - "${MONETIZE_SSH_PORT:-2224}:22"
      - "${MONETIZE_JUPYTER_PORT:-8892}:8888"
    volumes:
      # 通用工作区（invoke 路径解析为绝对 POSIX 并自动 mkdir；
      # 裸 compose 的相对路径相对本文件，../../workspace = client/workspace）
      - type: bind
        source: ${MONETIZE_WORKSPACE:-../../workspace}
        target: /workspace
        bind:
          create_host_path: true
      # agent-monetize 源码（裸 compose 相对路径：本文件在
      # overlays/agent-monetize-dev/，上 4 级到 apps/ 再进 agent-monetize；
      # invoke 路径把该变量解析为绝对 POSIX 路径）
      - type: bind
        source: ${MONETIZE_SRC_PATH:-../../../../agent-monetize}
        target: /workspace/agent-monetize
        bind:
          create_host_path: true
    environment:
      # 凭证四变量（USER_PASSWORD/JUPYTER_TOKEN/SSH_PUBLIC_KEY/GRANT_SUDO）
      # 与 rootless 三必需由 rootless-base 继承，勿在此重复声明。
      # 源码调试：src 布局包经 PYTHONPATH 直导（改源码即时生效）
      PYTHONPATH: /workspace/agent-monetize/src
      # ctypes 加载 score_opportunity.so 时解析其依赖 libtvm_ffi.so；
      # 与 build-native 设的绝对 rpath 双保险
      LD_LIBRARY_PATH: /opt/conda/lib/python3.14/site-packages/tvm_ffi/lib
    labels:
      org.specweave.component: "monetize"
