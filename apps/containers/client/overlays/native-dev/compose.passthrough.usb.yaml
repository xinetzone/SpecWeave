---
# compose.passthrough.usb.yaml — [5] USB 透传（opt-in）
#
# 用法：
#   invoke native.up --usb
#   podman-compose -f compose.yaml -f compose.passthrough.usb.yaml up -d
# 主层 + USB（host 网络形态）：
#   invoke native.up --passthrough --usb
#
# 前置 —— 设备路径缺失时 podman 硬失败（exit 125）：
#   test -e "${USB_DEVICE:-/dev/bus/usb}" && echo "USB OK"
# WSL2 宿主默认无 USB 总线：先在 Windows 侧用 usbipd-win 把设备转发到
# podman-machine-default（管理员 PowerShell）：
#   usbipd list
#   usbipd bind --busid <BUSID>
#   usbipd attach --wsl --distribution podman-machine-default --busid <BUSID>
# 物理 Linux 直接 lsusb 核对。
#
# 安全 —— 原始 USB 访问可让容器触达接入宿主的键盘、存储与调试探针。
# 仅用于可信镜像。
#
# devices 为追加合并，基座 /dev/fuse 保留。

services:
  native:
    devices:
      - ${USB_DEVICE:-/dev/bus/usb}:/dev/bus/usb
