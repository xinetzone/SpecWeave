---
# xmnn-dev 开发/打包叠加栈 - Compose Specification（podman-compose / rootless）
#
# 设计依据：OKF podman-compose 知识包
#   concepts/03-compose-patterns.md（服务/端口/绑定/环境变量模式）
#   concepts/02-rootless.md（rootless 设备与安全字段）
#   concepts/06-config-pipeline.md（深合并与 extends 服务级继承）
#   concepts/08-x-podman-extensions.md（标准字段优先，不滥用 x-podman）
# 硬约束：../../.agents/rules/xmnn-overlay.md
#
# 两种驱动方式：
#   ① invoke xmnn.*（apps/containers/client 下，WSL2/Linux/macOS；
#     extends.file 由 podman-compose 按本文件目录重写解析，任意 cwd 均可）
#   ② 裸 podman-compose（须在本目录内执行）：cp .env.example .env && podman-compose up -d
#
# rootless 三必需、凭证四变量、公共 labels/restart/network_mode 上移
# ../_shared/base-rootless.yaml（extends 单一事实源），本文件只保留
# xmnn 栈专属：image/build/ports/volumes/栈 env/组件 label。严禁 privileged。
#
# network_mode: bridge 现已由基文件统一提供（2026-09-14 同机实证：
# podman-machine-default 无 systemd user bus，默认项目网络启 aardvark-dns
# 必现「Failed to connect to user scope bus」，未改动的 onnx 栈同机复现；
# 与镜像谱系无关，详见 ../_shared/base-rootless.yaml 文件头）。

name: xmnn-dev

services:
  xmnn:
    extends:
      file: ../_shared/base-rootless.yaml
      service: rootless-base
    container_name: ${XMNN_CONTAINER_NAME:-xmnn-dev}
    image: ${XMNN_IMAGE_TAG:-localhost/xmnn-dev:latest}
    build:
      context: .
      dockerfile: Containerfile.xmnn-dev
      args:
        BASE_IMAGE: ${BASE_IMAGE:-localhost/jupyter-podman-rootless:latest}
        PIP_MIRROR: ${PIP_MIRROR:-official}
        CONDA_MIRROR: ${CONDA_MIRROR:-official}
    ports:
      - "${XMNN_SSH_PORT:-2223}:22"
      - "${XMNN_JUPYTER_PORT:-8890}:8888"
    volumes:
      # 全部长语法 bind：短语法在 podman-compose 下会 os.makedirs 误建源路径。
      # invoke 路径把四个宿主路径解析为绝对 POSIX 路径注入（存在性硬校验）；
      # 裸 compose 相对路径相对本文件：五级 ../../../../../ 回到仓库根。
      - type: bind
        source: ${XMNN_WORKSPACE:-../../workspace}
        target: /workspace
        bind:
          create_host_path: true
      - type: bind
        source: ${NPU_TVM_PATH:-../../../../../external/chaos/npu_tvm}
        target: /workspace/npu_tvm
        bind:
          create_host_path: true
      - type: bind
        source: ${NPUUSERTOOLS_PATH:-../../../../../external/chaos/npuusertools}
        target: /workspace/npuusertools
        bind:
          create_host_path: true
      - type: bind
        source: ${MODELS_PATH:-../../../../../external/chaos/models}
        target: /workspace/models
        bind:
          create_host_path: true
      # ccache 命名卷持久化（Nuitka C 编译缓存）；down 默认保留，--volumes 删除。
      # named volume 短语法安全（不触发短语法 bind 的 os.makedirs 问题）。
      - xmnn-ccache:/root/.ccache
    environment:
      # 凭证四变量（USER_PASSWORD/JUPYTER_TOKEN/SSH_PUBLIC_KEY/GRANT_SUDO）
      # 与 rootless 三必需由 rootless-base 继承，勿在此重复声明。
      # ── 源码调试链路：tvm/vta/xmnn 经 PYTHONPATH 直接从挂载树导入 ──
      PYTHONPATH: /workspace/npu_tvm/python:/workspace/npu_tvm/vta/python:/workspace/npuusertools
      TVM_LIBRARY_PATH: /workspace/npu_tvm/build
      # libtvm.so 的 NEEDED（libLLVM 22.1 等）由 main env 工具链 lib 满足；
      # build/vta 为 VTA sim 库目录。非登录 compose exec 与内核两路径共用。
      LD_LIBRARY_PATH: /workspace/npu_tvm/build:/workspace/npu_tvm/build/vta:/opt/conda/envs/main/lib
      NPU_TOOLS_ROOT: /workspace
      XMNN_TOOLS_ROOT: /workspace/npuusertools
      # 编译/推理调优（镜像/脚本默认值可被运行时覆盖）
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      NUITKA_JOBS: ${NUITKA_JOBS:-8}
    labels:
      org.specweave.component: "xmnn-dev"

volumes:
  xmnn-ccache: {}
