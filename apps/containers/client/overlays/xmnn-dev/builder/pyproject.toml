[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "xmnn"
version = "1.2.1-dev0"
description = "XMNN: NPU inference toolkit with Nuitka-compiled TVM/VTA runtime"
requires-python = ">=3.14.6"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "onnx>=1.15",
    "protobuf>=4.25",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "rich>=13.0",
    "tqdm>=4.66",
    "tomlkit>=0.12",
    "decorator>=5.1",
    "attrs>=23.0",
    "psutil>=5.9",
    "cloudpickle>=3.0",
    "typing_extensions>=4.8",
    "pytest>=7.0",
    "telnetlib3>=2.0",
    "typer>=0.12",
]

[project.scripts]
# wheel 安装后生成 /opt/conda/bin/xmflow（Nuitka 打包的包不支持
# `python -m` runpy 入口，console script 是交付镜像内 CLI 的唯一入口）
xmflow = "xmnn.cli.xmflow:app"

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "scikit-build-core>=0.5"]
examples = ["opencv-python-headless>=4.8"]
torch = ["torch>=2.2", "torchvision>=0.17", "onnx2pytorch>=0.4"]
full = ["xmnn[dev,examples,torch]"]

[tool.scikit-build]
cmake.version = ">=3.18"
ninja.version = ">=1.10"
cmake.build-type = "Release"
wheel.install-dir = "."
cmake.source-dir = "."
