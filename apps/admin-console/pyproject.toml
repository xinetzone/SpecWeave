[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "admin-console"
version = "0.1.0"
description = "通用内容管理后台：登录认证 / 数据看板 / 列表管理 / 表单编辑 / Supabase 云端持久化与存储 / 响应式 / Vercel 一键上线"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
admin-console = "admin_console.cli:main"

[tool.scikit-build]
wheel.packages = ["src/admin_console"]
build-dir = "build/{wheel_tag}"
minimum-version = "0.9"
sdist.exclude = ["tests", "web", "api", "scripts", ".venv", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
