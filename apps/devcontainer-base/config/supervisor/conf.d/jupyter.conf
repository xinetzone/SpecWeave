[program:jupyter]
user=devuser
command=/opt/conda/bin/jupyter lab --config=/home/devuser/.jupyter/jupyter_notebook_config.py
directory=/workspace
autorestart=true
startretries=3
startsecs=10
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/jupyter-stderr.log
stderr_logfile_maxbytes=1048576
redirect_stderr=false
environment=HOME="/home/devuser",USER="devuser",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8",PATH="/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
