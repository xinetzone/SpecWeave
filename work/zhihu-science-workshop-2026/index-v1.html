<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆实验室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3EFE7'/%3E%3Cpath d='M5 22 C9 8, 13 8, 17 20 S 25 22, 28 12' fill='none' stroke='%238B6B43' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F3EFE7; --card:#FBF8F1; --ink:#37322C; --muted:#7A7168;
    --line:#DED5C7; --accent:#8B6B43; --accent-soft:#E8DCC8;
    --good:#5E7C68; --warn:#A8654B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
  body{
    background:var(--paper); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ===== 首屏 ===== */
  header.hero{
    min-height:72vh; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start;
    padding:64px 0 48px;
  }
  .hero h1{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    font-size:clamp(34px,6vw,56px); font-weight:700; letter-spacing:2px;
  }
  .hero .sub{
    margin-top:14px; font-size:clamp(16px,2.4vw,20px); color:var(--muted);
    max-width:34em;
  }
  .hero .cta{
    margin-top:34px; display:inline-flex; align-items:center; gap:10px;
    background:var(--accent); color:#FBF8F1; border:none;
    font-size:17px; padding:13px 26px; border-radius:12px; cursor:pointer;
    box-shadow:0 1px 2px rgba(55,50,44,.06);
    transition:background .18s ease, transform .18s ease;
    text-decoration:none;
  }
  .hero .cta:hover{background:#7A5D3A;}
  .hero .cta:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:3px;
  }

  /* ===== 实验台（占位） ===== */
  main{padding-bottom:48px;}
  section#lab{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:clamp(24px,5vw,48px); margin-bottom:48px;
  }
  .placeholder{
    color:var(--muted); font-size:16px; padding:48px 0; text-align:center;
  }

  /* ===== 页脚 ===== */
  footer{
    border-top:1px solid var(--line); padding:26px 0 40px;
    color:var(--muted); font-size:14px;
  }

  /* ===== 响应式 ===== */
  @media (min-width:768px){
    .wrap{padding:0 32px;}
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- ===== 首屏 ===== -->
    <header class="hero">
      <h1>记忆实验室</h1>
      <p class="sub">把遗忘曲线变成可以拖动的实验台</p>
      <a class="cta" href="#lab">开始调参</a>
    </header>

    <!-- ===== 实验台（下一步生成） ===== -->
    <main>
      <section id="lab" aria-labelledby="lab-title">
        <h2 id="lab-title" style="font-family:'Songti SC','Noto Serif SC',Georgia,serif; font-size:24px;">实验台</h2>
        <p class="placeholder">实验台将在下一步生成</p>
      </section>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
      <p>这是一个简化的学习科学模型，不用于预测个人成绩。</p>
    </footer>

  </div>

  <script>
    (function(){
      "use strict";
      // 首屏 CTA 平滑滚动：链接 href="#lab" 由浏览器原生处理，
      // 此处仅做增强：确保焦点移动到手目标，方便键盘用户。
      var cta = document.querySelector('.cta');
      var lab = document.getElementById('lab');
      if (cta && lab) {
        cta.addEventListener('click', function(){
          requestAnimationFrame(function(){
            lab.setAttribute('tabindex', '-1');
            lab.focus({ preventScroll: true });
          });
        });
      }
    })();
  </script>
</body>
</html>
