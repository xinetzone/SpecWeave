<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆实验室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3EFE7'/%3E%3Cpath d='M5 22 C9 8, 13 8, 17 20 S 25 22, 28 12' fill='none' stroke='%238B6B43' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F3EFE7; --card:#FBF8F1; --ink:#37322C; --muted:#7A7168;
    --line:#DED5C7; --accent:#8B6B43; --accent-soft:#E8DCC8;
    --good:#5E7C68; --warn:#A8654B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
  body{
    background:var(--paper); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ===== 首屏 ===== */
  header.hero{
    min-height:72vh; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start;
    padding:64px 0 48px;
  }
  .hero h1{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    font-size:clamp(34px,6vw,56px); font-weight:700; letter-spacing:2px;
  }
  .hero .sub{
    margin-top:14px; font-size:clamp(16px,2.4vw,20px); color:var(--muted);
    max-width:34em;
  }
  .hero .cta{
    margin-top:34px; display:inline-flex; align-items:center; gap:10px;
    background:var(--accent); color:#FBF8F1; border:none;
    font-size:17px; padding:13px 26px; border-radius:12px; cursor:pointer;
    box-shadow:0 1px 2px rgba(55,50,44,.06);
    transition:background .18s ease;
    text-decoration:none;
  }
  .hero .cta:hover{background:#7A5D3A;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:3px;
  }

  /* ===== 实验台 ===== */
  main{padding-bottom:48px;}
  section#lab{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:clamp(24px,5vw,48px); margin-bottom:48px;
  }
  #lab h2{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif; font-size:24px;
  }
  .lab-intro{color:var(--muted); font-size:15px; margin:6px 0 22px;}
  .lab-grid{display:flex; flex-direction:column; gap:26px;}
  @media (min-width:900px){
    .lab-grid{flex-direction:row; align-items:flex-start;}
    .controls{flex:0 0 320px;}
    .chart-col{flex:1 1 auto; min-width:0;}
  }

  /* 控件 */
  .control{margin-bottom:20px;}
  .control label{display:flex; justify-content:space-between; align-items:baseline;
    font-size:15px; margin-bottom:8px;}
  .control output{font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600;}
  input[type="range"]{
    width:100%; accent-color:var(--accent); cursor:pointer;
    min-height:24px;
  }
  select{
    width:100%; font-size:15px; padding:9px 12px; border-radius:12px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    appearance:auto;
  }
  .reset-btn{
    margin-top:4px; padding:10px 18px; font-size:15px; border-radius:12px;
    border:1px solid var(--line); background:var(--accent-soft); color:var(--ink);
    cursor:pointer;
  }
  .reset-btn:hover{background:#DCCBA9;}

  /* 图表 */
  .chart-col{min-width:0;}
  .chart-wrap{position:relative; width:100%;}
  canvas#chart{display:block; width:100%; height:auto;}
  .chart-tip{
    position:absolute; pointer-events:none; display:none;
    background:rgba(55,50,44,.92); color:#FBF8F1; font-size:13px;
    padding:7px 11px; border-radius:8px; white-space:nowrap;
    transform:translate(-50%, calc(-100% - 8px));
  }
  .chart-note{color:var(--muted); font-size:13px; margin-top:8px;}

  /* 统计卡 */
  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:28px;}
  @media (min-width:900px){
    .stats{grid-template-columns:repeat(4,1fr);}
  }
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
  }
  .stat .k{font-size:13px; color:var(--muted);}
  .stat .v{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;
    margin-top:2px; font-family:"Songti SC","Noto Serif SC",Georgia,serif;}

  /* ===== 页脚 ===== */
  footer{border-top:1px solid var(--line); padding:26px 0 40px;
    color:var(--muted); font-size:14px;}

  @media (min-width:768px){
    .wrap{padding:0 32px;}
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- ===== 首屏 ===== -->
    <header class="hero">
      <h1>记忆实验室</h1>
      <p class="sub">把遗忘曲线变成可以拖动的实验台</p>
      <a class="cta" href="#lab">开始调参</a>
    </header>

    <!-- ===== 实验台 ===== -->
    <main>
      <section id="lab" aria-labelledby="lab-title">
        <h2 id="lab-title">实验台</h2>
        <p class="lab-intro">拖动滑块，看遗忘曲线怎么变；每次复习会抬升保持率并增大稳定度。</p>

        <div class="lab-grid">
          <div class="controls">
            <div class="control">
              <label for="r0">初始保持率 R0 <output id="r0Out" for="r0">90%</output></label>
              <input type="range" id="r0" min="50" max="100" step="1" value="90">
            </div>
            <div class="control">
              <label for="s">记忆稳定度 S（天） <output id="sOut" for="s">2 天</output></label>
              <input type="range" id="s" min="0.5" max="10" step="0.1" value="2">
            </div>
            <div class="control">
              <label for="count">复习次数 <output id="countOut" for="count">2 次</output></label>
              <input type="range" id="count" min="0" max="5" step="1" value="2">
            </div>
            <div class="control">
              <label for="strategy">复习间隔</label>
              <select id="strategy">
                <option value="0">1 天</option>
                <option value="1" selected>1+3 天</option>
                <option value="2">1+3+7 天</option>
                <option value="3">1+3+7+14 天</option>
              </select>
            </div>
            <button type="button" class="reset-btn" id="resetBtn">重置参数</button>
          </div>

          <div class="chart-col">
            <div class="chart-wrap">
              <canvas id="chart" aria-label="30 天保持率曲线：当前策略与无复习对比"></canvas>
              <div class="chart-tip" id="chartTip" role="status"></div>
            </div>
            <p class="chart-note">横轴 0–30 天，纵轴 0–100%。实线 = 当前复习策略，虚线 = 不复习。悬停或点击曲线可查看某天的数值。</p>
          </div>
        </div>

        <div class="stats" id="stats" aria-label="关键统计">
          <div class="stat"><div class="k">第 7 天保持率</div><div class="v" id="st7">—</div></div>
          <div class="stat"><div class="k">第 14 天保持率</div><div class="v" id="st14">—</div></div>
          <div class="stat"><div class="k">第 30 天保持率</div><div class="v" id="st30">—</div></div>
          <div class="stat"><div class="k">30 天平均保持率</div><div class="v" id="stAvg">—</div></div>
        </div>
      </section>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
      <p>这是一个简化的学习科学模型，不用于预测个人成绩。</p>
    </footer>

  </div>

  <script>
    (function(){
      "use strict";

      /* ===== 模型 ===== */
      // R(t) = R0 * exp(-t / S)
      // 复习发生时：R = min(1, R + (1 - R) * 0.6)；S = S * 1.6
      var STRATEGIES = [
        { label: "1 天",            days: [1] },
        { label: "1+3 天",          days: [1, 3] },
        { label: "1+3+7 天",        days: [1, 3, 7] },
        { label: "1+3+7+14 天",     days: [1, 3, 7, 14] }
      ];

      function computeCurve(R0, S, reviewDays) {
        var curve = new Array(31);
        var r = R0, s = S, last = 0;
        for (var d = 0; d <= 30; d++) {
          var R = r * Math.exp(-(d - last) / s);
          if (reviewDays.indexOf(d) !== -1) {
            R = Math.min(1, R + (1 - R) * 0.6);
            r = R; s = s * 1.6; last = d;
          }
          curve[d] = R;
        }
        return curve;
      }

      /* ===== 状态 ===== */
      var state = {
        r0: 0.9,
        s: 2,
        count: 2,
        strategyIdx: 1
      };

      /* ===== DOM ===== */
      var elR0 = document.getElementById('r0');
      var elS = document.getElementById('s');
      var elCount = document.getElementById('count');
      var elStrategy = document.getElementById('strategy');
      var elReset = document.getElementById('resetBtn');
      var canvas = document.getElementById('chart');
      var ctx = canvas.getContext('2d');
      var tip = document.getElementById('chartTip');
      var statEls = {
        st7: document.getElementById('st7'),
        st14: document.getElementById('st14'),
        st30: document.getElementById('st30'),
        stAvg: document.getElementById('stAvg')
      };
      var outs = {
        r0: document.getElementById('r0Out'),
        s: document.getElementById('sOut'),
        count: document.getElementById('countOut')
      };

      /* ===== 画布尺寸（DPR 适配） ===== */
      var cssW = 0, cssH = 0, dpr = 1;
      function resizeCanvas() {
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        var rect = canvas.getBoundingClientRect();
        cssW = Math.max(280, rect.width);
        cssH = Math.round(cssW * 0.56);           // 固定纵横比，避免高度抖动
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        canvas.style.height = cssH + 'px';
        scheduleDraw();
      }

      /* ===== 数据 ===== */
      function currentReviewDays() {
        var days = STRATEGIES[state.strategyIdx].days;
        var n = Math.min(state.count, days.length);
        return days.slice(0, n);
      }

      /* ===== 绘制 ===== */
      var PAD = { top: 18, right: 16, bottom: 38, left: 48 };

      function draw() {
        if (!cssW) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssW, cssH);
        ctx.font = "12px 'PingFang SC','Microsoft YaHei',sans-serif";
        ctx.textBaseline = 'middle';

        var plotW = cssW - PAD.left - PAD.right;
        var plotH = cssH - PAD.top - PAD.bottom;

        // 网格与坐标轴
        ctx.strokeStyle = '#E5DCCB';
        ctx.fillStyle = '#7A7168';
        ctx.lineWidth = 1;
        var yTicks = [0, 0.2, 0.4, 0.6, 0.8, 1];
        for (var i = 0; i < yTicks.length; i++) {
          var y = PAD.top + plotH - yTicks[i] * plotH;
          ctx.beginPath();
          ctx.moveTo(PAD.left, y);
          ctx.lineTo(PAD.left + plotW, y);
          ctx.stroke();
          ctx.textAlign = 'right';
          ctx.fillText(Math.round(yTicks[i] * 100) + '%', PAD.left - 8, y);
        }
        var xTicks = [0, 5, 10, 15, 20, 25, 30];
        for (var j = 0; j < xTicks.length; j++) {
          var x = PAD.left + xTicks[j] / 30 * plotW;
          ctx.beginPath();
          ctx.moveTo(x, PAD.top);
          ctx.lineTo(x, PAD.top + plotH);
          ctx.stroke();
          ctx.textAlign = 'center';
          ctx.fillText(xTicks[j] + ' 天', x, PAD.top + plotH + 18);
        }
        // 轴线
        ctx.strokeStyle = '#B9AA93';
        ctx.beginPath();
        ctx.moveTo(PAD.left, PAD.top);
        ctx.lineTo(PAD.left, PAD.top + plotH);
        ctx.lineTo(PAD.left + plotW, PAD.top + plotH);
        ctx.stroke();

        // 曲线数据
        var curveMain = computeCurve(state.r0, state.s, currentReviewDays());
        var curveNone = computeCurve(state.r0, state.s, []);

        function drawLine(data, color, dash) {
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.setLineDash(dash || []);
          ctx.beginPath();
          for (var d = 0; d <= 30; d++) {
            var px = PAD.left + d / 30 * plotW;
            var py = PAD.top + plotH - data[d] * plotH;
            if (d === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }
        drawLine(curveNone, '#999999', [5, 5]);
        drawLine(curveMain, '#8B6B43', []);

        // 图例（画布内，右上角）
        ctx.font = "12px 'PingFang SC','Microsoft YaHei',sans-serif";
        var lx = PAD.left + plotW - 150, ly = PAD.top + 14;
        ctx.fillStyle = 'rgba(251,248,241,.92)';
        ctx.fillRect(lx - 8, ly - 12, 158, 30);
        ctx.strokeStyle = '#DED5C7';
        ctx.strokeRect(lx - 8, ly - 12, 158, 30);
        ctx.strokeStyle = '#8B6B43'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(lx, ly - 1); ctx.lineTo(lx + 22, ly - 1); ctx.stroke();
        ctx.fillStyle = '#37322C'; ctx.textAlign = 'left';
        ctx.fillText('当前策略', lx + 28, ly - 1);
        ctx.strokeStyle = '#999999'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(lx, ly + 14); ctx.lineTo(lx + 22, ly + 14); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#37322C';
        ctx.fillText('无复习', lx + 28, ly + 14);

        // 悬停标记（若有）
        if (hoverDay >= 0) {
          var hx = PAD.left + hoverDay / 30 * plotW;
          ctx.strokeStyle = 'rgba(138,107,67,.55)';
          ctx.setLineDash([3, 4]);
          ctx.beginPath(); ctx.moveTo(hx, PAD.top); ctx.lineTo(hx, PAD.top + plotH); ctx.stroke();
          ctx.setLineDash([]);
          var hy = PAD.top + plotH - curveMain[hoverDay] * plotH;
          ctx.fillStyle = '#8B6B43';
          ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2); ctx.fill();
        }
      }

      var hoverDay = -1;

      /* ===== 统计卡 ===== */
      function updateStats() {
        var c = computeCurve(state.r0, state.s, currentReviewDays());
        var sum = 0;
        for (var d = 0; d <= 30; d++) sum += c[d];
        statEls.st7.textContent = pct(c[7]);
        statEls.st14.textContent = pct(c[14]);
        statEls.st30.textContent = pct(c[30]);
        statEls.stAvg.textContent = pct(sum / 31);
      }

      function pct(v) {
        return Math.round(v * 100) + '%';
      }

      /* ===== 悬停 / 触屏 ===== */
      function posToDay(evt) {
        var rect = canvas.getBoundingClientRect();
        var clientX = (evt.touches && evt.touches[0]) ? evt.touches[0].clientX : evt.clientX;
        var plotW = cssW - PAD.left - PAD.right;
        var x = clientX - rect.left - PAD.left;
        var d = Math.round(x / plotW * 30);
        return Math.max(0, Math.min(30, d));
      }

      function showTip(day, show) {
        var curveMain = computeCurve(state.r0, state.s, currentReviewDays());
        var curveNone = computeCurve(state.r0, state.s, []);
        if (show) {
          tip.style.display = 'block';
          tip.textContent = '第 ' + day + ' 天 · 当前策略 ' + pct(curveMain[day]) + ' · 无复习 ' + pct(curveNone[day]);
          var rect = canvas.getBoundingClientRect();
          var x = PAD.left + day / 30 * (cssW - PAD.left - PAD.right);
          tip.style.left = x + 'px';
          tip.style.top = (PAD.top + 8) + 'px';
          hoverDay = day;
        } else {
          tip.style.display = 'none';
          hoverDay = -1;
        }
        scheduleDraw();
      }

      canvas.addEventListener('mousemove', function (e) {
        var rect = canvas.getBoundingClientRect();
        var inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
        if (inside) showTip(posToDay(e), true);
        else showTip(0, false);
      });
      canvas.addEventListener('mouseleave', function () { showTip(0, false); });
      canvas.addEventListener('click', function (e) {
        showTip(posToDay(e), true);
      });
      canvas.addEventListener('touchstart', function (e) {
        showTip(posToDay(e), true);
        e.preventDefault();
      }, { passive: false });

      /* ===== 重绘调度（rAF 合并） ===== */
      var drawQueued = false;
      function scheduleDraw() {
        if (drawQueued) return;
        drawQueued = true;
        requestAnimationFrame(function () {
          drawQueued = false;
          draw();
        });
      }

      /* ===== 输入联动 ===== */
      function readState() {
        state.r0 = parseFloat(elR0.value) / 100;
        state.s = parseFloat(elS.value);
        state.count = parseInt(elCount.value, 10);
        state.strategyIdx = parseInt(elStrategy.value, 10);
      }

      function refreshAll() {
        readState();
        outs.r0.textContent = Math.round(state.r0 * 100) + '%';
        outs.s.textContent = (Math.round(state.s * 10) / 10) + ' 天';
        outs.count.textContent = state.count + ' 次';
        updateStats();
        scheduleDraw();
      }

      [elR0, elS, elCount, elStrategy].forEach(function (el) {
        el.addEventListener('input', refreshAll);
        el.addEventListener('change', refreshAll);
      });

      elReset.addEventListener('click', function () {
        elR0.value = 90; elS.value = 2; elCount.value = 2; elStrategy.value = 1;
        refreshAll();
      });

      /* ===== 首屏 CTA 焦点增强 ===== */
      var cta = document.querySelector('.cta');
      var lab = document.getElementById('lab');
      if (cta && lab) {
        cta.addEventListener('click', function () {
          requestAnimationFrame(function () {
            lab.setAttribute('tabindex', '-1');
            lab.focus({ preventScroll: true });
          });
        });
      }

      /* ===== 初始化 ===== */
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      refreshAll();
    })();
  </script>
</body>
</html>
