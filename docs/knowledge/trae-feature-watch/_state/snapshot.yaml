  - id: traecode-cli-2-doc
    url: https://docs.trae.cn/cli_about-trae-code-cli-2
    product: TraeCode CLI 2.0（本地终端编码 Agent）
    discovered_at: "2026-10-01（本监测首次发现；官方文档全站挂出『TraeCode CLI 2.0 已上线』提示）"
    release_date: 待核验（官方文档未标注具体上线日期）
    related_docs:
      - https://docs.trae.cn/cli_what-is-trae-cli
      - https://docs.trae.cn/cli_get-started-with-trae-cli
      - https://docs.trae.cn/cli_get-started-with-trae-code-cli-2
    key_facts:
      - 本地终端编码 Agent：理解仓库、读写工作区、执行命令、生成与评审代码
      - 交互式 TUI：@提及文件、粘贴图片、执行 Shell、Slash 命令管理模型/权限/上下文
      - 非交互 traecli exec，可接入脚本与 CI
      - 支持 Agent Client Protocol（ACP），可作为智能体服务端接入支持 ACP 的编辑器/客户端
      - 与桌面端统一的插件 / 技能（Skill）/ MCP 扩展体系；用户级配置 + 项目级信任 + 环境变量
      - 权限安全：目录信任、沙箱模式、审批策略
      - 诊断：/status、/doctor、状态栏与日志
      - 升级：启动自动升级；traecli update 手动升级
      - 使用限制：仅 TRAE 企业版旗舰版套餐；默认 Max 模式需关注用量
      - 安装：macOS/Linux curl install.sh；Windows PowerShell irm install.ps1 | iex
    captured_in_report: 2026-10-01（2 条）

