  - 首篇特性报告生成时：创建 docs/knowledge/trae-feature-watch/index.md（含 toctree 收录报告），并在 docs/knowledge/index.md 的 toctree 与分类表中登记 trae-feature-watch/index，避免 Sphinx 断链
  - 报告命名：YYYY-MM-DD-trae-feature-watch.md（运行日日期，kebab-case），frontmatter 必含 source 字段
  - 国内站 IDE changelog 停滞观察：复查 https://docs.trae.cn/ide/changelog 是否更新（基线时停在 2026-06-09）
