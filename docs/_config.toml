# 主题选项配置
[html_theme_options]
# Logo 设置
logo = { image_light = "_static/images/logo.png", image_dark = "_static/images/logo.png" }

# 仓库相关设置
repository_url = "https://gitcode.com/daoCollective/SpecWeave"
repository_provider = "gitlab"
use_repository_button = true
repository_branch = "main"
use_edit_page_button = true
path_to_docs = "docs"
use_download_button = true
use_issues_button = true

# 界面布局设置
toc_title = "目录"
show_navbar_depth = 1
max_navbar_depth = 7
use_fullscreen_button = true

# 顶部导航栏常驻组件：显式置空，阻止 pydata-sphinx-theme 自动注入页头搜索按钮。
# 搜索入口保留在左侧边栏（SBT sidebars 配置）与文章工具栏放大镜图标，Ctrl+K 快捷键不受影响。
navbar_persistent = []

# 图标链接配置
icon_links = []
