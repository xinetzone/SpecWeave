name: zhihu-checkin-hub CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/dev-tools/zhihu-checkin-hub/**"
      - ".github/workflows/zhihu-checkin-hub-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/dev-tools/zhihu-checkin-hub/**"
      - ".github/workflows/zhihu-checkin-hub-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff TID251 gate + pytest (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dev-tools/zhihu-checkin-hub
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (TID251 __future__ ban)
        run: ruff check .

      - name: Pytest (含 __future__ AST 守护门禁)
        run: python -m pytest -q
