name: Sensitive Information Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sensitive-info-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      # 阻断门禁：仅 high 等级失败即红（2026-10-19 分层改造）
      - name: Run sensitive information scan (blocking: high)
        working-directory: .agents/scripts
        run: python check-sensitive-info.py --only-severity high

  # 全量汇总（不阻断）：medium/low 一并输出为构件，供周检与 triage 使用
  sensitive-info-full-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full scan (non-blocking summary)
        working-directory: .agents/scripts
        continue-on-error: true
        run: python check-sensitive-info.py --json --output sensitive-info-full.json

      - name: Upload full report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensitive-info-full-report
          path: .agents/scripts/sensitive-info-full.json
          if-no-files-found: ignore
