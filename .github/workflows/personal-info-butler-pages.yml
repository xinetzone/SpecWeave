# 个人信息管家 Agent —— 静态站发布到 GitHub Pages
#
# 与 projects/daoapps.github.io 同链路：gates（pytest）→ build（sphinx -W）→ deploy。
# 后端是独立的常驻服务，不在此工作流内发布（见应用 README 的「发布上线」）。
#
# 仓库 Settings → Pages 的 Source 必须是 GitHub Actions（不是分支）。
# BUTLER_API_BASE 通过仓库变量（Settings → Secrets and variables → Actions → Variables）
# 注入构建，读者打开站点即可直连后端；不设置则读者在页面「设置」里自行填写。

name: Deploy personal-info-butler to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/ai-agents/personal-info-butler/**"
      - ".github/workflows/personal-info-butler-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-personal-info-butler"
  cancel-in-progress: true

jobs:
  gates:
    name: gates（API 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-agents/personal-info-butler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 目标运行时 Python 3.14；与 Dockerfile 的 python:3.14-slim 对齐
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

  build:
    name: build（Sphinx -W）
    needs: gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-agents/personal-info-butler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build site
        env:
          BUTLER_API_BASE: ${{ vars.BUTLER_API_BASE }}
        run: |
          python -m sphinx -b html -d _build/doctrees --keep-going -W doc _build/html

      - name: Clean up build artifacts
        run: |
          rm -f _build/html/environment.pickle
          find _build/html -name "*.doctree" -type f -delete
          find _build/html -name "*.pyc" -type f -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/ai-agents/personal-info-butler/_build/html

  deploy:
    name: deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
