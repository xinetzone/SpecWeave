# ONNX Quantization Toolkit CI
# =============================================
# Runs onnx_quantize_kit test suite and CI quantization gate on push/PR.
name: ONNX Quantization Toolkit CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/devcontainer-base/scripts/onnx_quantize_kit/**"
      - "apps/devcontainer-base/scripts/test_quantize_kit.py"
      - "apps/devcontainer-base/scripts/ci_quantization_gate.py"
      - "apps/devcontainer-base/scripts/ci-requirements.txt"
      - ".github/workflows/onnx-quantize-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "apps/devcontainer-base/scripts/onnx_quantize_kit/**"
      - "apps/devcontainer-base/scripts/test_quantize_kit.py"
      - "apps/devcontainer-base/scripts/ci_quantization_gate.py"
      - "apps/devcontainer-base/scripts/ci-requirements.txt"
      - ".github/workflows/onnx-quantize-ci.yml"

  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Accuracy threshold for CI gate (max_diff)"
        required: false
        default: "0.05"
        type: string
      run_performance_benchmark:
        description: "Run performance benchmark (slower)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: "onnx-quantize-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: apps/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install onnxconverter-common onnxsim pytest

      - name: Run test_quantize_kit.py
        working-directory: apps/devcontainer-base/scripts
        run: |
          python test_quantize_kit.py 2>&1 | tee /tmp/test_output.log
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/devcontainer-base/scripts:${PYTHONPATH}

      - name: Report test results
        if: always()
        run: |
          echo "=== Test output tail ==="
          tail -20 /tmp/test_output.log

  ci-gate:
    name: CI Quantization Gate (Mock Models)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install onnxconverter-common onnxsim

      - name: Generate test ONNX models
        working-directory: apps/devcontainer-base/scripts
        run: |
          python -c "
import torch, onnx, os, tempfile
import numpy as np

MODEL_DIR = '${{ github.workspace }}/apps/devcontainer-base/scripts/.ci_test_models'
os.makedirs(MODEL_DIR, exist_ok=True)

# Model 1: Simple CNN (good for static quantization)
class SimpleCNN(torch.nn.Module):
    def __init__(self):
        super().__init__()
        self.conv = torch.nn.Conv2d(3, 8, 3, padding=1)
        self.pool = torch.nn.AdaptiveAvgPool2d(1)
        self.fc = torch.nn.Linear(8, 10)
    def forward(self, x):
        x = self.conv(x)
        x = torch.relu(x)
        x = self.pool(x)
        x = x.view(x.size(0), -1)
        return self.fc(x)

torch.onnx.export(SimpleCNN().eval(), torch.randn(1,3,32,32),
                  os.path.join(MODEL_DIR, 'cnn.onnx'),
                  input_names=['input'], output_names=['output'],
                  opset_version=14)

# Model 2: MLP (simple)
class MLP(torch.nn.Module):
    def __init__(self):
        super().__init__()
        self.net = torch.nn.Sequential(
            torch.nn.Linear(128, 64), torch.nn.ReLU(),
            torch.nn.Linear(64, 32), torch.nn.ReLU(),
            torch.nn.Linear(32, 10),
        )
    def forward(self, x):
        return self.net(x)

torch.onnx.export(MLP().eval(), torch.randn(1,128),
                  os.path.join(MODEL_DIR, 'mlp.onnx'),
                  input_names=['input'], output_names=['output'],
                  opset_version=13)

print(f'Test models generated in {MODEL_DIR}')
for f in os.listdir(MODEL_DIR):
    size = os.path.getsize(os.path.join(MODEL_DIR, f))
    print(f'  {f}: {size} bytes')
"
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run CI quantization gate on CNN model
        working-directory: apps/devcontainer-base/scripts
        run: |
          python ci_quantization_gate.py \
            --model .ci_test_models/cnn.onnx \
            --output .ci_test_models/cnn_quantized.onnx \
            --accuracy-threshold ${{ github.event.inputs.accuracy_threshold || '0.1' }} \
            --calibration-samples 10 \
            --benchmark-samples 50 \
            --report .ci_test_models/cnn_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run CI quantization gate on MLP model (dynamic)
        working-directory: apps/devcontainer-base/scripts
        run: |
          python ci_quantization_gate.py \
            --model .ci_test_models/mlp.onnx \
            --output .ci_test_models/mlp_quantized.onnx \
            --accuracy-threshold 0.1 \
            --calibration-samples 5 \
            --report .ci_test_models/mlp_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/devcontainer-base/scripts:${PYTHONPATH}

      - name: Display reports
        if: always()
        working-directory: apps/devcontainer-base/scripts
        run: |
          echo "=== CNN Quantization Report ==="
          cat .ci_test_models/cnn_report.json 2>/dev/null || echo "No CNN report"
          echo ""
          echo "=== MLP Quantization Report ==="
          cat .ci_test_models/mlp_report.json 2>/dev/null || echo "No MLP report"

      - name: Upload quantization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantization-reports-${{ github.sha }}
          path: apps/devcontainer-base/scripts/.ci_test_models/*_report.json
          retention-days: 30

      - name: Cleanup test models
        if: always()
        run: |
          rm -rf ${{ github.workspace }}/apps/devcontainer-base/scripts/.ci_test_models
