# ONNX Quantization Toolkit CI
# =============================================
# Runs onnx_quantize_kit unit tests, ORT regression tests, and CI quantization gate.
#
# Trigger rules:
#   - Push to main: when quantization toolkit code, tests, Dockerfile, or CI config change
#   - Pull Request to main: same path filters
#   - Manual dispatch: with configurable accuracy threshold and benchmark toggle
#   - Weekly schedule: Sunday 02:00 UTC (full regression + performance benchmark)
name: ONNX Quantization Toolkit CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/docker-images/devcontainer-base/scripts/onnx_quantize_kit/**"
      - "apps/docker-images/devcontainer-base/scripts/test_quantize_kit.py"
      - "apps/docker-images/devcontainer-base/scripts/test_onnxruntime_quantization.py"
      - "apps/docker-images/devcontainer-base/scripts/test_ort_quantization_regression.py"
      - "apps/docker-images/devcontainer-base/scripts/test_neural_compressor.py"
      - "apps/docker-images/devcontainer-base/scripts/ci_quantization_gate.py"
      - "apps/docker-images/devcontainer-base/scripts/verify-deployment.py"
      - "apps/docker-images/devcontainer-base/scripts/ci-requirements.txt"
      - "apps/docker-images/devcontainer-base/variants/onnx-quantized/**"
      - ".github/workflows/onnx-quantize-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "apps/docker-images/devcontainer-base/scripts/onnx_quantize_kit/**"
      - "apps/docker-images/devcontainer-base/scripts/test_quantize_kit.py"
      - "apps/docker-images/devcontainer-base/scripts/test_onnxruntime_quantization.py"
      - "apps/docker-images/devcontainer-base/scripts/test_ort_quantization_regression.py"
      - "apps/docker-images/devcontainer-base/scripts/test_neural_compressor.py"
      - "apps/docker-images/devcontainer-base/scripts/ci_quantization_gate.py"
      - "apps/docker-images/devcontainer-base/scripts/verify-deployment.py"
      - "apps/docker-images/devcontainer-base/scripts/ci-requirements.txt"
      - "apps/docker-images/devcontainer-base/variants/onnx-quantized/**"
      - ".github/workflows/onnx-quantize-ci.yml"

  schedule:
    # Weekly full regression: Sunday 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Accuracy threshold for CI gate (max_diff)"
        required: false
        default: "0.05"
        type: string
      run_performance_benchmark:
        description: "Run performance benchmark (slower)"
        required: false
        default: "false"
        type: boolean
      python_version:
        description: "Python version override (default: matrix all)"
        required: false
        default: ""
        type: string
      test_scope:
        description: "Test scope"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit-only
          - regression-only
          - gate-only

concurrency:
  group: "onnx-quantize-ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  # ======================================================================
  # Job 1: Unit Tests (multi-Python matrix)
  # ======================================================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/docker-images/devcontainer-base/scripts/ci-requirements.txt

      - name: Install dependencies (CPU-only torch for speed)
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          # Override torch with CPU-only build to speed up CI
          pip install torch --index-url https://download.pytorch.org/whl/cpu --force-reinstall
          pip install onnxconverter-common onnxsim

      - name: Run onnxruntime.quantization API unit tests
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python test_onnxruntime_quantization.py 2>&1 | tee /tmp/test_ort_api.log
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run onnx_quantize_kit unit tests
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python test_quantize_kit.py 2>&1 | tee /tmp/test_kit.log
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            /tmp/test_ort_api.log
            /tmp/test_kit.log
          retention-days: 14

  # ======================================================================
  # Job 2: ORT Regression Tests (the NEW test_ort_quantization_regression.py)
  # ======================================================================
  regression-tests:
    name: ORT Regression Tests (G1-G11)
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/docker-images/devcontainer-base/scripts/ci-requirements.txt

      - name: Install dependencies (CPU-only torch)
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu --force-reinstall
          pip install onnxconverter-common onnxsim
          echo "=== Installed versions ==="
          python -c "import onnxruntime; print(f'onnxruntime: {onnxruntime.__version__}')"
          python -c "import onnx; print(f'onnx: {onnx.__version__}')"
          python -c "import torch; print(f'torch: {torch.__version__}')"
          python -c "import numpy; print(f'numpy: {numpy.__version__}')"

      - name: Verify no neural_compressor hard dependency
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          echo "=== Checking for hard neural_compressor dependency ==="
          HARD_DEPS=$(grep -rn "^import neural_compressor\|^from neural_compressor" onnx_quantize_kit/ 2>/dev/null || true)
          if [ -n "$HARD_DEPS" ]; then
            echo "::error::Found hard neural_compressor imports in onnx_quantize_kit/:"
            echo "$HARD_DEPS"
            exit 1
          fi
          echo "✅ No hard neural_compressor dependency found in onnx_quantize_kit/"
          echo ""
          echo "=== Verifying onnx_quantize_kit imports without neural_compressor ==="
          python -c "
          from onnx_quantize_kit import (
              auto_quantize, quantize_dynamic_simple, quantize_static_qdq,
              quantize_static_qoperator, quantize_fp16, benchmark_model,
              validate_accuracy, RandomCalibrationReader, FileCalibrationReader,
              detect_model_type, QuantizationConfig, QuantizationResult,
              AccuracyThresholds, BenchmarkResult, ModelType,
          )
          print('✅ All onnx_quantize_kit public APIs imported successfully')
          print(f'   QuantizationConfig default strategy: {QuantizationConfig().strategy}')
          print(f'   AccuracyThresholds default cos: {AccuracyThresholds().min_cosine_sim}')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run ORT regression tests (test_ort_quantization_regression.py)
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python test_ort_quantization_regression.py 2>&1 | tee /tmp/test_regression.log
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Extract regression test summary
        if: always()
        run: |
          echo "=== Regression test summary ==="
          tail -30 /tmp/test_regression.log
          echo ""
          echo "=== Failure detection ==="
          if grep -q "❌.*FAILED" /tmp/test_regression.log; then
            echo "::error::Regression tests detected failures!"
            grep "❌" /tmp/test_regression.log | head -20
            exit 1
          fi

      - name: Upload regression test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-log-py${{ matrix.python-version }}-${{ github.sha }}
          path: /tmp/test_regression.log
          retention-days: 30

  # ======================================================================
  # Job 3: CI Quantization Gate (end-to-end with auto_quantize pipeline)
  # ======================================================================
  ci-gate:
    name: CI Quantization Gate (E2E)
    runs-on: ubuntu-latest
    needs: regression-tests
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_scope == 'all' ||
      github.event.inputs.test_scope == 'gate-only'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/docker-images/devcontainer-base/scripts/ci-requirements.txt

      - name: Install dependencies (CPU-only torch)
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu --force-reinstall
          pip install onnxconverter-common onnxsim

      - name: Generate test ONNX models
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python - <<'PYEOF'
import torch, onnx, os
import numpy as np

MODEL_DIR = os.path.join(os.environ["GITHUB_WORKSPACE"], "apps/docker-images/devcontainer-base/scripts/.ci_test_models")
os.makedirs(MODEL_DIR, exist_ok=True)

# Model 1: Simple CNN (good for static QDQ quantization)
class SimpleCNN(torch.nn.Module):
    def __init__(self):
        super().__init__()
        self.conv = torch.nn.Conv2d(3, 8, 3, padding=1)
        self.pool = torch.nn.AdaptiveAvgPool2d(1)
        self.fc = torch.nn.Linear(8, 10)
    def forward(self, x):
        x = self.conv(x)
        x = torch.relu(x)
        x = self.pool(x)
        x = x.view(x.size(0), -1)
        return self.fc(x)

torch.onnx.export(SimpleCNN().eval(), torch.randn(1,3,32,32),
                  os.path.join(MODEL_DIR, 'cnn.onnx'),
                  input_names=['input'], output_names=['output'],
                  opset_version=17, do_constant_folding=True)

# Model 2: MLP (good for dynamic quantization)
class MLP(torch.nn.Module):
    def __init__(self):
        super().__init__()
        self.net = torch.nn.Sequential(
            torch.nn.Linear(128, 256), torch.nn.ReLU(),
            torch.nn.Linear(256, 128), torch.nn.ReLU(),
            torch.nn.Linear(128, 64), torch.nn.ReLU(),
            torch.nn.Linear(64, 10),
        )
    def forward(self, x):
        return self.net(x)

torch.onnx.export(MLP().eval(), torch.randn(1,128),
                  os.path.join(MODEL_DIR, 'mlp.onnx'),
                  input_names=['input'], output_names=['output'],
                  opset_version=17, do_constant_folding=True)

# Model 3: Small Transformer-like (attention pattern)
class TinyTransformer(torch.nn.Module):
    def __init__(self, d_model=64, nhead=4):
        super().__init__()
        self.q_proj = torch.nn.Linear(d_model, d_model)
        self.k_proj = torch.nn.Linear(d_model, d_model)
        self.v_proj = torch.nn.Linear(d_model, d_model)
        self.out_proj = torch.nn.Linear(d_model, d_model)
        self.nhead = nhead
        self.d_k = d_model // nhead
    def forward(self, x):
        # x: (batch, seq, d_model)
        q = self.q_proj(x)
        k = self.k_proj(x)
        v = self.v_proj(x)
        # Simple scaled dot-product attention
        import math
        scores = torch.matmul(q, k.transpose(-2, -1)) / math.sqrt(self.d_k)
        attn = torch.softmax(scores, dim=-1)
        out = torch.matmul(attn, v)
        return self.out_proj(out)

torch.onnx.export(TinyTransformer().eval(), torch.randn(1,10,64),
                  os.path.join(MODEL_DIR, 'transformer.onnx'),
                  input_names=['input'], output_names=['output'],
                  opset_version=17, do_constant_folding=True)

print(f'Test models generated in {MODEL_DIR}')
for f in sorted(os.listdir(MODEL_DIR)):
    size = os.path.getsize(os.path.join(MODEL_DIR, f))
    print(f'  {f}: {size:,} bytes')
PYEOF
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run CI quantization gate on CNN model
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python ci_quantization_gate.py \
            --model .ci_test_models/cnn.onnx \
            --output .ci_test_models/cnn_quantized.onnx \
            --accuracy-threshold ${{ github.event.inputs.accuracy_threshold || '0.1' }} \
            --calibration-samples 20 \
            --benchmark-samples ${{ github.event.inputs.run_performance_benchmark == 'true' && '100' || '50' }} \
            --report .ci_test_models/cnn_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run CI quantization gate on MLP model (dynamic)
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python ci_quantization_gate.py \
            --model .ci_test_models/mlp.onnx \
            --output .ci_test_models/mlp_quantized.onnx \
            --accuracy-threshold 0.1 \
            --calibration-samples 10 \
            --benchmark-samples 50 \
            --report .ci_test_models/mlp_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Run auto_quantize end-to-end on Transformer model
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python - <<'PYEOF'
import sys, os, json
sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "apps/docker-images/devcontainer-base/scripts"))
from onnx_quantize_kit import auto_quantize, RandomCalibrationReader

MODEL_DIR = os.path.join(os.environ["GITHUB_WORKSPACE"], "apps/docker-images/devcontainer-base/scripts/.ci_test_models")
model_path = os.path.join(MODEL_DIR, "transformer.onnx")
output_path = os.path.join(MODEL_DIR, "transformer_quantized.onnx")

calib_reader = RandomCalibrationReader("input", (1, 10, 64), num_samples=10)
result = auto_quantize(
    model_path, output_path,
    calib_reader=calib_reader,
    verbose=True,
)

print(f"\n=== auto_quantize result for Transformer ===")
print(f"  Success: {result.success}")
print(f"  Strategy used: {result.strategy_used}")
print(f"  Model type: {result.model_type}")
if result.accuracy:
    print(f"  Cosine similarity: {result.accuracy.cosine_sim:.6f}")
    print(f"  Max diff: {result.accuracy.max_diff:.6f}")
if result.performance:
    print(f"  FP32 latency: {result.performance.fp32_avg_ms:.2f}ms")
    print(f"  INT8 latency: {result.performance.quantized_avg_ms:.2f}ms")
    print(f"  Speedup: {result.speedup:.2f}x")
print(f"  Size ratio: {result.size_ratio:.1%}")
if result.fallback_triggered:
    print(f"  Fallback triggered: {result.fallback_reason}")

# Save report
report = result.to_dict()
with open(os.path.join(MODEL_DIR, "transformer_report.json"), "w") as f:
    json.dump(report, f, indent=2, default=str)

if not result.success:
    print(f"\n::error::auto_quantize failed for Transformer model: {result.error}")
    sys.exit(1)

# Accuracy gate
if result.accuracy and result.accuracy.cosine_sim < 0.90:
    print(f"\n::error::Transformer accuracy below safety threshold: cos_sim={result.accuracy.cosine_sim:.4f}")
    sys.exit(1)

print(f"\n✅ auto_quantize passed for Transformer model")
PYEOF
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Display quantization reports
        if: always()
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          echo "=== CNN Quantization Report ==="
          cat .ci_test_models/cnn_report.json 2>/dev/null || echo "No CNN report"
          echo ""
          echo "=== MLP Quantization Report ==="
          cat .ci_test_models/mlp_report.json 2>/dev/null || echo "No MLP report"
          echo ""
          echo "=== Transformer auto_quantize Report ==="
          cat .ci_test_models/transformer_report.json 2>/dev/null || echo "No Transformer report"

      - name: Upload quantization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantization-reports-${{ github.sha }}
          path: apps/docker-images/devcontainer-base/scripts/.ci_test_models/*_report.json
          retention-days: 30

      - name: Cleanup test models
        if: always()
        run: |
          rm -rf ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts/.ci_test_models

  # ======================================================================
  # Job 4: Weekly performance benchmark (schedule only or manual trigger)
  # ======================================================================
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: regression-tests
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_benchmark == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu --force-reinstall
          pip install onnxconverter-common onnxsim

      - name: Run performance benchmark comparison
        working-directory: apps/docker-images/devcontainer-base/scripts
        run: |
          python - <<'PYEOF'
import sys, os, time, json, tempfile
sys.path.insert(0, ".")
import torch
import numpy as np
import onnx
from onnx_quantize_kit import (
    auto_quantize, quantize_dynamic_simple, quantize_static_qdq,
    quantize_fp16, benchmark_model, validate_accuracy,
    RandomCalibrationReader, detect_model_type,
)

# Create a representative MLP model
class MLP(torch.nn.Module):
    def __init__(self):
        super().__init__()
        self.net = torch.nn.Sequential(
            torch.nn.Linear(512, 1024), torch.nn.ReLU(),
            torch.nn.Linear(1024, 1024), torch.nn.ReLU(),
            torch.nn.Linear(1024, 512), torch.nn.ReLU(),
            torch.nn.Linear(512, 256), torch.nn.ReLU(),
            torch.nn.Linear(256, 10),
        )
    def forward(self, x):
        return self.net(x)

tmpdir = tempfile.mkdtemp()
fp32_path = os.path.join(tmpdir, "mlp_fp32.onnx")
model = MLP().eval()
torch.onnx.export(model, torch.randn(1, 512), fp32_path,
                  input_names=["input"], output_names=["output"],
                  opset_version=17, do_constant_folding=True)

print("=" * 60)
print("PERFORMANCE BENCHMARK: FP32 vs INT8 vs FP16")
print("=" * 60)

# FP32 baseline
fp32_perf = benchmark_model(fp32_path, (1, 512), num_runs=200, num_warmup=20)
print(f"FP32:  {fp32_perf.fp32_avg_ms:.2f}ms avg, size={fp32_perf.fp32_size_kb:.0f}KB")

# Dynamic INT8
int8_path = os.path.join(tmpdir, "mlp_int8.onnx")
quantize_dynamic_simple(fp32_path, int8_path)
int8_perf = benchmark_model(int8_path, (1, 512), num_runs=200, num_warmup=20)
int8_acc = validate_accuracy(fp32_path, int8_path, (1, 512))
print(f"INT8:  {int8_perf.quantized_avg_ms:.2f}ms avg, size={int8_perf.quantized_size_kb:.0f}KB, "
      f"speedup={int8_perf.speedup:.2f}x, cos_sim={int8_acc.cosine_sim:.6f}")

# FP16
fp16_path = os.path.join(tmpdir, "mlp_fp16.onnx")
quantize_fp16(fp32_path, fp16_path)
fp16_perf = benchmark_model(fp16_path, (1, 512), num_runs=200, num_warmup=20)
fp16_acc = validate_accuracy(fp32_path, fp16_path, (1, 512))
print(f"FP16:  {fp16_perf.quantized_avg_ms:.2f}ms avg, size={fp16_perf.quantized_size_kb:.0f}KB, "
      f"speedup={fp16_perf.speedup:.2f}x, cos_sim={fp16_acc.cosine_sim:.6f}")

# Size comparison
fp32_size = os.path.getsize(fp32_path)
int8_size = os.path.getsize(int8_path)
fp16_size = os.path.getsize(fp16_path)
print(f"\nSize reduction: INT8={int8_size/fp32_size:.1%}, FP16={fp16_size/fp32_size:.1%}")

# Write benchmark report to /tmp for artifact upload
report = {
    "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
    "python": sys.version.split()[0],
    "onnxruntime": __import__("onnxruntime").__version__,
    "onnx": onnx.__version__,
    "torch": torch.__version__,
    "model": "MLP(512→1024→1024→512→256→10)",
    "input_shape": [1, 512],
    "results": {
        "fp32": {"avg_ms": fp32_perf.fp32_avg_ms, "size_kb": fp32_perf.fp32_size_kb},
        "int8_dynamic": {
            "avg_ms": int8_perf.quantized_avg_ms,
            "size_kb": int8_perf.quantized_size_kb,
            "speedup": int8_perf.speedup,
            "cosine_sim": float(int8_acc.cosine_sim),
            "max_diff": float(int8_acc.max_diff),
        },
        "fp16": {
            "avg_ms": fp16_perf.quantized_avg_ms,
            "size_kb": fp16_perf.quantized_size_kb,
            "speedup": fp16_perf.speedup,
            "cosine_sim": float(fp16_acc.cosine_sim),
            "max_diff": float(fp16_acc.max_diff),
        },
    },
}

bench_path = "/tmp/benchmark_report.json"
with open(bench_path, "w") as f:
    json.dump(report, f, indent=2)
print(f"\nBenchmark report saved to {bench_path}")

import shutil
shutil.rmtree(tmpdir, ignore_errors=True)
PYEOF
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/docker-images/devcontainer-base/scripts:${PYTHONPATH}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-${{ github.sha }}
          path: /tmp/benchmark_report.json
          retention-days: 90

  # ======================================================================
  # Job 5: CI Summary (gate that all required jobs passed)
  # ======================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, regression-tests, ci-gate]
    if: always()

    steps:
      - name: Check all job results
        run: |
          echo "=== CI Job Results ==="
          echo "  unit-tests:        ${{ needs.unit-tests.result }}"
          echo "  regression-tests:  ${{ needs.regression-tests.result }}"
          echo "  ci-gate:           ${{ needs.ci-gate.result }}"
          echo ""

          FAILED=0
          for job in unit-tests regression-tests ci-gate; do
            RESULT="${{ needs[job].result }}"
            if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
              echo "::error::Job '$job' finished with status: $RESULT"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ ONE OR MORE CI JOBS FAILED"
            exit 1
          else
            echo "✅ ALL REQUIRED CI JOBS PASSED"
          fi
