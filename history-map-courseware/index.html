<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物交互地图课件 · 合集总览</title>
<style>
  :root{
    --ink:#2a2420; --gold:#b8884a; --red:#9c3b2e; --paper:#f4ece0;
    --panel:#fbf6ec; --line:#ddd0bc; --soft:#6b5d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    color:var(--ink); background:var(--paper);
    min-height:100vh; padding:0 0 40px;
    background-image:radial-gradient(circle at 20% 10%, #fbf4e6 0, var(--paper) 60%);
  }
  .hero{
    text-align:center; padding:54px 20px 30px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#fbf6ec,#f1e6d3);
  }
  .hero h1{font-size:34px; letter-spacing:6px; color:var(--red);}
  .hero .sub{margin-top:12px; font-size:14px; color:var(--soft); letter-spacing:2px;}
  .hero .seal{
    display:inline-block; margin-top:16px; padding:3px 14px; border:1px solid var(--gold);
    border-radius:16px; font-size:12px; color:var(--gold); letter-spacing:2px;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:34px 20px 0;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:22px;
  }
  .card{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:24px 22px 20px; text-decoration:none; color:inherit;
    box-shadow:0 2px 10px rgba(0,0,0,.05); transition:.22s; overflow:hidden;
    display:flex; flex-direction:column; min-height:238px;
  }
  .card:before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--ac);
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 10px 26px rgba(0,0,0,.14); border-color:var(--ac);}
  .card .hd{display:flex; align-items:center; gap:14px;}
  .card .avatar{
    width:62px; height:62px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--ac); box-shadow:0 2px 8px rgba(0,0,0,.18); background:#f1e6d3;
  }
  .card .hdtext{display:flex; flex-direction:column;}
  .card .nm{font-size:27px; letter-spacing:4px; color:var(--ac);}
  .card .aka{font-size:12.5px; color:var(--soft); margin-top:5px; letter-spacing:.5px;}
  .card .era{
    display:inline-block; margin-top:12px; align-self:flex-start;
    padding:2px 11px; border-radius:12px; font-size:11.5px; color:#fff; background:var(--ac);
  }
  .card .role{font-size:13px; color:#4a3f33; margin-top:12px; line-height:1.6;}
  .card .q{
    margin-top:12px; padding:9px 12px; background:#f6eddd; border-left:3px solid var(--ac);
    font-size:12.5px; color:#5a4632; line-height:1.7; border-radius:3px; flex:1;
  }
  .card .meta{
    margin-top:14px; display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:var(--soft); border-top:1px dashed var(--line); padding-top:10px;
  }
  .card .meta .go{color:var(--ac); font-weight:bold;}
  .foot{max-width:1040px; margin:34px auto 0; padding:0 20px; text-align:center;
    font-size:11.5px; color:#9a8b78; line-height:1.8;}
  @media (max-width:560px){ .hero h1{font-size:27px;letter-spacing:4px;} }
</style>
</head>
<body>
  <header class="hero">
    <h1 id="title">历史人物交互地图课件</h1>
    <div class="sub" id="subtitle"></div>
    <div class="seal">合集总览</div>
  </header>
  <main class="wrap">
    <div class="grid" id="grid"></div>
  </main>
  <div class="foot" id="foot"></div>

  <script src="manifest.js"></script>
  <script>
    (function(){
      var M = window.COURSEWARE_MANIFEST || {people:[]};
      document.getElementById('title').textContent = M.title || '历史人物交互地图课件';
      document.getElementById('subtitle').textContent = M.subtitle || '';
      document.getElementById('foot').textContent = M.footer || '';
      var grid = document.getElementById('grid');
      (M.people || []).forEach(function(p){
        var a = document.createElement('a');
        a.className = 'card';
        a.href = p.entry;
        a.style.setProperty('--ac', p.accent || '#b8884a');
        a.innerHTML =
            '<div class="hd">'
          + (p.avatar ? '<img class="avatar" src="' + p.avatar + '" alt="' + p.name + '肖像" loading="lazy">' : '')
          + '<div class="hdtext"><div class="nm">' + p.name + '</div>'
          + '<div class="aka">' + (p.aka||'') + '</div></div></div>'
          + '<span class="era">' + (p.era||'') + '</span>'
          + '<div class="role">' + (p.role||'') + '</div>'
          + '<div class="q">“' + (p.quote||'') + '”</div>'
          + '<div class="meta"><span>足迹点 · ' + (p.points||'-') + ' 站 ｜ '
          + (p.region||'') + '</span><span class="go">进入地图 →</span></div>';
        grid.appendChild(a);
      });
    })();
  </script>
</body>
</html>
