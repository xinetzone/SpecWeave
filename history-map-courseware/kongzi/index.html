<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孔子生平足迹 · 交互地图课件</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{
    --ink:#2a2420; --gold:#b8884a; --red:#9c3b2e; --paper:#f4ece0;
    --panel:#fbf6ec; --line:#ddd0bc; --soft:#6b5d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    color:var(--ink); background:var(--paper); overflow:hidden;
  }
  #app{display:flex;height:100vh;}
  /* 侧栏 */
  #side{
    width:390px; min-width:390px; height:100%; background:var(--panel);
    border-right:2px solid var(--line); display:flex; flex-direction:column;
    box-shadow:2px 0 14px rgba(0,0,0,.08); z-index:500;
  }
  .hd{padding:20px 22px 14px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#fbf6ec,#f1e6d3);}
  .hd h1{font-size:25px; letter-spacing:3px; color:var(--red);}
  .hd .sub{font-size:12.5px; color:var(--soft); margin-top:6px; letter-spacing:1px;}
  .hd .aka{font-size:12px;color:var(--gold);margin-top:4px;}
  .quote{
    margin:12px 22px 0; padding:12px 16px; border-left:3px solid var(--gold);
    background:#f6eddd; font-size:15px; color:#5a4632; line-height:1.7;
  }
  .quote small{display:block;margin-top:6px;color:var(--soft);font-size:11.5px;letter-spacing:1px;}
  .bio{padding:12px 22px 4px;font-size:13px;line-height:1.85;color:#4a3f33;}
  .dis{margin:8px 22px 0;padding:9px 13px;background:#fdf3e9;border:1px dashed var(--gold);
    font-size:11.5px;color:#7a5a38;line-height:1.7;border-radius:4px;}
  .tl-hd{padding:14px 22px 6px;font-size:13px;color:var(--red);letter-spacing:2px;font-weight:bold;}
  #timeline{flex:1;overflow-y:auto;padding:0 14px 20px;}
  .tl{
    position:relative;margin:0 6px;padding:13px 14px 13px 40px;cursor:pointer;
    border-radius:8px;transition:.2s;border:1px solid transparent;
  }
  .tl:before{content:"";position:absolute;left:17px;top:0;bottom:-1px;width:2px;background:var(--line);}
  .tl .dot{position:absolute;left:11px;top:16px;width:15px;height:15px;border-radius:50%;
    background:#fff;border:3px solid var(--gold);z-index:2;}
  .tl:last-child:before{bottom:50%;}
  .tl:hover{background:#f3e8d6;}
  .tl.active{background:#f0e0c8;border-color:var(--gold);}
  .tl.active .dot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(156,59,46,.15);}
  .tl .t{font-size:14.5px;font-weight:bold;color:var(--ink);}
  .tl .yr{font-size:11.5px;color:var(--gold);margin:3px 0;letter-spacing:.5px;}
  .tl .pl{font-size:12px;color:var(--soft);}
  .tl.alt .dot{border-style:dashed;}
  .foot{padding:10px 22px;border-top:1px solid var(--line);font-size:10.5px;color:#9a8b78;line-height:1.6;}
  /* 地图 */
  #map{flex:1;height:100%;background:#aad3df;}
  .leaflet-popup-content-wrapper{background:var(--panel);border-radius:8px;border:1px solid var(--gold);}
  .leaflet-popup-content{margin:14px 16px;font-family:inherit;color:var(--ink);width:290px!important;}
  .pop h3{font-size:16px;color:var(--red);margin-bottom:7px;letter-spacing:1px;}
  .pop .row{font-size:12.5px;margin:4px 0;line-height:1.6;}
  .pop .k{color:var(--gold);font-weight:bold;}
  .pop .ev{font-size:12.5px;line-height:1.75;color:#4a3f33;margin:7px 0;padding-top:7px;border-top:1px dashed var(--line);}
  .pop .meta{font-size:11px;color:var(--soft);margin-top:6px;}
  .pop .cf{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#fff;margin-left:4px;}
  .cf-h{background:#4a8a52;} .cf-m{background:#c08a3e;} .cf-l{background:#9c3b2e;}
  .pop .disp{margin-top:7px;padding:7px 9px;background:#fdf3e9;border-left:2px solid var(--red);
    font-size:11px;color:#7a5038;line-height:1.65;border-radius:3px;}
  .pop .src{font-size:10.5px;color:#9a8b78;margin-top:6px;font-style:italic;}
  .badge{position:absolute;z-index:600;top:14px;right:14px;background:rgba(251,246,236,.94);
    border:1px solid var(--gold);border-radius:20px;padding:6px 15px;font-size:11.5px;color:var(--soft);}
  /* 数字 marker */
  .nmk{background:var(--red);color:#fff;border-radius:50%;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;
    border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:serif;}
  .nmk.alt{background:#c08a3e;}
  .ctrl{position:absolute;z-index:600;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;background:rgba(251,246,236,.95);padding:7px 10px;border-radius:24px;
    border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .ctrl button{font-family:inherit;border:none;background:var(--red);color:#fff;
    padding:6px 15px;border-radius:16px;cursor:pointer;font-size:12.5px;letter-spacing:1px;}
  .ctrl button.ghost{background:#e8dcc6;color:var(--ink);}
  .ctrl button:hover{opacity:.88;}
  @media (max-width:820px){
    #app{flex-direction:column;} #side{width:100%;min-width:0;height:48%;}
    #map{height:52%;} .leaflet-popup-content{width:220px!important;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="hd">
      <h1 id="pname">孔子</h1>
      <div class="aka" id="paka"></div>
      <div class="sub" id="pera"></div>
    </div>
    <div class="quote" id="pquote"></div>
    <div class="bio" id="pbio"></div>
    <div class="dis" id="pdis"></div>
    <div class="tl-hd">生平足迹 · 时间线</div>
    <div id="timeline"></div>
    <div class="foot" id="pfoot"></div>
  </aside>
  <div id="map">
    <div class="badge">点击地图标记或左侧时间线查看讲解</div>
    <div class="ctrl">
      <button id="prev" class="ghost">◀ 上一站</button>
      <button id="play">▶ 自动巡览</button>
      <button id="next" class="ghost">下一站 ▶</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="kongzi_data.js"></script>
<script src="app.js"></script>
</body>
</html>
