# ===================================================================
#  Sphinx 文档站 CI 配置（GitHub Actions）
#
#  学生用法：
#    1. 在项目根目录建 .github/workflows/ 两级文件夹
#    2. 把本文件复制成 .github/workflows/docs.yml
#    3. push 到 main 分支 → 自动构建并部署到 GitHub Pages
#
#  ⚠️ 本文件与 handbook/task-3-ci.md「步骤 3」里的内容完全一致。
#     如果你改了本文件，记得同步改手册（反之亦然）——这是 NFR-4 的要求。
# ===================================================================

name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build docs (warnings as errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
