# ===================================================================
#  Sphinx 文档站 CI 配置（自托管 runner / 内网 Git 服务版）
#
#  什么时候用这个文件？
#    学校机房访问不了 github.com 时用。配合内网 Gitea / GitLab 使用。
#    见 handbook/task-3-ci.md「如果学校网络访问不了 GitHub？」一节。
#
#  ⚠️ 与 GitHub 版的区别只有最后两步（部署方式）。
#     前面「装依赖 → sphinx-build -W → 产出静态文件」完全一样——
#     那才是本任务要教的东西。
#
#  ===================================================================
#  🔧 教师本地化清单（开课前请逐项确认）→ 已移至教师包
#  ===================================================================
#
#  这里原本内嵌了 3 项"开课前要改什么"的说明。已移到
#  teacher/SETUP-CHECKLIST.md「docs-intranet.yml 本地化三项」一节——
#  因为本文件会被发放给学生（见 starters/README.md §五 方式 A/B），
#  学生手上不该出现"请教师确认"的待办。
#
#  教师请查：teacher/SETUP-CHECKLIST.md §内网部署
#  学生须知：下方 3 处若有不符合学校环境的，以教师发放版本为准，
#            不要自行改动（改了会与全班不一致）。
#
#  ⚠️ 三项之外的其他内容请勿修改——尤其「Build docs」那一步，
#     它是本任务的教学目标（见 task-3-ci.md）。
# ===================================================================

name: Build and Deploy Docs (内网版)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted          # 【本地化 1】按贵校 runner 标签填写
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 【本地化 2】按机房实际 Python 版本填写

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ↓↓↓ 这一步与 GitHub 版完全相同——这才是重点，请勿修改 ↓↓↓
      - name: Build docs (warnings as errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      # ===============================================================
      #  DEPLOY-MODE：以下二选一，默认启用方式 B
      #  （取消注释某一方式、注释掉另一方式即可切换）
      # ===============================================================

      # --- 方式 A：直接拷贝到内网 Web 服务器的文档根目录 ---
      #     适用：runner 有免密 SSH 或本地 Web 根目录写权限
      #     需本地化：把 /var/www/docs/ 换成贵校实际 Web 根目录
      # - name: Deploy to intranet webroot
      #   run: |
      #     rsync -a --delete docs/_build/html/ /var/www/docs/

      # --- 方式 B：打包成 artifact，交给内网平台发布（默认启用）---
      #     适用：任何环境；产物可在 Actions 页面下载后手工发布
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

# ===================================================================
#  发布后自检（把 artifact 发布到内网 Web 后执行）
# ===================================================================
#  在浏览器打开内网站点，确认：
#    [ ] 首页可访问（不是 404 / 不是目录列表）
#    [ ] 左侧导航包含 glossary / api 两个页面（Task2、Task5 的产物）
#    [ ] 点进任一楼层的 "View page source" 能看到静态 HTML
#
#  任一项失败时，优先查【1】runner 标签与【2】Python 版本——
#  这两项写错会让 CI 整个不跑，且报错信息不指向真正原因。
