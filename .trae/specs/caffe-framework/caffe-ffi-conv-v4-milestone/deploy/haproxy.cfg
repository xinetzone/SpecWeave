# =============================================================================
# HAProxy 配置 — caffe-ffi 延迟敏感多副本负载均衡
#
# 特性：
#   - 主动健康检查：GET /health，3s 探测，fall 3 次摘除 / rise 2 次恢复
#   - 动态解析：通过 Docker 内置 DNS(127.0.0.11) 解析服务名，支持 --scale 扩缩容
#   - 轮询分发 round-robin
#
# 前置：真实推理服务必须暴露 HTTP /health 端点（返回 200）
# 统计页：http://localhost:8404/stats (admin:admin)
# =============================================================================

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# 借助 Docker 嵌入式 DNS 实现服务名动态解析（支持 --scale 动态扩缩容）
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http-in
    bind *:8080
    default_backend caffe-backend

backend caffe-backend
    balance roundrobin
    # 主动健康检查：下游故障实时感知，比 Nginx OSS 被动检查更及时
    option httpchk GET /health
    http-check expect status 200
    server caffe-ffi-prod caffe-ffi-prod:8080 check inter 3s fall 3 rise 2 \
        resolvers docker resolve-prefer ipv4